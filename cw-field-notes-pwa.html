<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>Field Notes — C&W</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#111;--sb:#141414;--s1:#1a1a1a;--s2:#222;--s3:#2a2a2a;
  --b1:#252525;--b2:#333;
  --accent:#E8622A;--accent-dim:rgba(232,98,42,.13);
  --green:#34a872;--green-dim:rgba(52,168,114,.12);
  --blue:#4a90d9;--blue-dim:rgba(74,144,217,.1);
  --red:#e05252;--red-dim:rgba(224,82,82,.12);
  --tx1:#f0ede8;--tx2:#c0bdb8;--tx3:#8a8780;--tx4:#555250;
  --mono:'DM Mono',monospace;--disp:'Syne',sans-serif;--body:'DM Sans',sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --sb-w:210px;--topbar-h:56px;--tool-h:52px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--tx1);font-family:var(--body);-webkit-font-smoothing:antialiased}

/* ── SIDEBAR ── */
.sidebar{display:none;width:var(--sb-w);background:var(--sb);border-right:1px solid var(--b1);flex-direction:column;position:fixed;top:0;left:0;height:100%;z-index:20}
.sb-hdr{padding:20px 16px 14px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:10px}
.sb-pill{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-brand{font-family:var(--disp);font-size:14px;font-weight:700;color:var(--tx1)}
.sb-brand-sub{font-family:var(--mono);font-size:9px;color:var(--tx4);text-transform:uppercase;letter-spacing:.08em}
.sb-nav{padding:10px 8px;flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--tx3);font-size:13px;font-weight:500;transition:all .15s;border:1px solid transparent}
.sb-item:hover{background:var(--s2);color:var(--tx1)}
.sb-item.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(232,98,42,.15)}
.sb-icon{width:15px;height:15px;flex-shrink:0}
.sb-lbl{flex:1}
.sb-foot{padding:12px 16px;border-top:1px solid var(--b1);display:flex;flex-direction:column;gap:6px}
.sb-date{font-family:var(--mono);font-size:10px;color:var(--tx4)}

/* ── MOBILE TOPBAR ── */
.mob-topbar{height:var(--topbar-h);background:var(--sb);border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;position:fixed;top:0;left:0;right:0;z-index:30;padding-top:var(--safe-top)}
.mob-logo{display:flex;align-items:center;gap:8px}
.mob-pill{width:26px;height:26px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.mob-title{font-family:var(--disp);font-size:14px;font-weight:700}
.mob-sub{font-family:var(--mono);font-size:9px;color:var(--tx4);text-transform:uppercase;letter-spacing:.07em}
.mob-right{display:flex;align-items:center;gap:6px}

/* ── MAIN LAYOUT ── */
.app-wrap{height:100vh;display:flex;flex-direction:column;padding-top:var(--topbar-h)}
.notes-list{flex:none;background:var(--s1);border-bottom:1px solid var(--b1);overflow-x:auto;display:flex;align-items:stretch;gap:0;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-height:52px}
.notes-list::-webkit-scrollbar{display:none}
.note-tab{display:flex;align-items:center;gap:7px;padding:0 14px;white-space:nowrap;cursor:pointer;font-size:12px;color:var(--tx3);border-right:1px solid var(--b1);border-bottom:3px solid transparent;transition:all .15s;min-width:120px;flex-shrink:0;position:relative}
.note-tab.active{color:var(--tx1);border-bottom-color:var(--accent);background:var(--bg)}
.note-tab-name{flex:1;overflow:hidden;text-overflow:ellipsis}
.note-tab-del{background:none;border:none;color:var(--tx4);font-size:16px;cursor:pointer;padding:0 2px;line-height:1;opacity:0;transition:opacity .15s;flex-shrink:0}
.note-tab:hover .note-tab-del{opacity:1}
.new-note-btn{display:flex;align-items:center;gap:5px;padding:0 14px;color:var(--tx4);font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:color .15s;border:none;background:none}
.new-note-btn:hover{color:var(--accent)}

/* ── CANVAS AREA ── */
.canvas-area{flex:1;position:relative;overflow:hidden;background:#0a0a0a;cursor:crosshair}
.canvas-wrap{position:absolute;transform-origin:0 0;will-change:transform}
#baseCanvas{display:block;background:#fff}
#annoCanvas{position:absolute;top:0;left:0;cursor:crosshair;touch-action:none}

/* ── TOOLBAR ── */
.toolbar{height:var(--tool-h);background:var(--s1);border-top:1px solid var(--b1);display:flex;align-items:center;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.toolbar::-webkit-scrollbar{display:none}
.tool-sep{width:1px;height:26px;background:var(--b2);flex-shrink:0;margin:0 4px}
.tool-btn{width:36px;height:36px;border-radius:9px;border:none;background:transparent;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;position:relative}
.tool-btn:hover{background:var(--s3);color:var(--tx1)}
.tool-btn.active{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(232,98,42,.25)}
.tool-btn.active-color{background:var(--s3)}
.color-dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.2);flex-shrink:0;cursor:pointer;transition:transform .15s}
.color-dot:hover,.color-dot.active{transform:scale(1.25);border-color:rgba(255,255,255,.6)}
.size-btn{font-family:var(--mono);font-size:10px;padding:4px 8px;border-radius:6px;border:1px solid var(--b2);background:transparent;color:var(--tx3);cursor:pointer;transition:all .15s;flex-shrink:0}
.size-btn.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(232,98,42,.3)}
.page-nav{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0}
.page-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--b1);background:transparent;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.page-btn:hover:not(:disabled){background:var(--s3);color:var(--tx1)}
.page-btn:disabled{opacity:.3;cursor:default}
.page-lbl{font-family:var(--mono);font-size:10px;color:var(--tx3);white-space:nowrap;min-width:40px;text-align:center}

/* ── EMPTY STATE ── */
.empty-drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;pointer-events:none;opacity:.6}
.empty-drop-icon{font-size:48px}
.empty-drop-title{font-family:var(--disp);font-size:20px;font-weight:700;color:var(--tx2)}
.empty-drop-sub{font-size:13px;color:var(--tx4);text-align:center;line-height:1.6}
.drop-actions{display:flex;gap:10px;pointer-events:all;opacity:1}
.drop-btn{padding:11px 20px;border-radius:11px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .15s;border:none}
.drop-btn.primary{background:var(--accent);color:#fff}
.drop-btn.primary:hover{opacity:.9}
.drop-btn.secondary{background:var(--s2);color:var(--tx2);border:1px solid var(--b2)}
.drop-btn.secondary:hover{background:var(--s3);color:var(--tx1)}

/* ── TEXT OVERLAY ── */
.text-input-overlay{position:absolute;background:rgba(0,0,0,.7);border:2px solid var(--accent);border-radius:6px;padding:6px 8px;font-family:var(--body);font-size:14px;color:#fff;outline:none;resize:none;min-width:120px;min-height:32px;z-index:10;display:none}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--tool-h) + 12px);left:50%;transform:translateX(-50%) translateY(20px);background:#1e1e1e;border:1px solid var(--b2);border-radius:10px;padding:9px 16px;font-size:12px;font-family:var(--mono);color:var(--tx1);opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.green{border-color:var(--green);color:var(--green)}

/* ── DESKTOP ── */
@media(min-width:768px){
  html,body{overflow:hidden}
  .sidebar{display:flex}
  .mob-topbar{display:none}
  .app-wrap{padding-top:0;margin-left:var(--sb-w);height:100vh}
}
</style>
</head>

<script>
(function(){
'use strict';

// ── STORAGE HELPERS ──
function getNotes(){try{return JSON.parse(localStorage.getItem('cw-field-notes')||'[]');}catch(e){return[];}}
function saveNotes(n){try{localStorage.setItem('cw-field-notes',JSON.stringify(n));}catch(e){showToast('Storage full — export and clear old notes');}}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

// ── TOAST ──
var toastTimer;
function showToast(msg,style){
  var t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show'+(style?' '+style:'');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.className='toast';},3000);
}

// ── STATE ──
var notes=getNotes();
var activeNoteId=null;
var currentTool='pen';
var currentColor='#e05252';
var currentSize=4;
var scale=1;
var panX=0,panY=0;
var isDrawing=false;
var lastX=0,lastY=0;
var undoStack=[];
var redoStack=[];
var pdfDoc=null;
var currentPage=1;
var totalPages=1;
var arrowStart=null;

// ── CANVAS REFS ──
var baseCtx,annoCtx;
function initCanvases(){
  var bc=document.getElementById('baseCanvas');
  var ac=document.getElementById('annoCanvas');
  baseCtx=bc.getContext('2d');
  annoCtx=ac.getContext('2d');
  return{base:bc,anno:ac};
}

// ── NOTE TABS ──
function renderTabs(){
  var list=document.getElementById('notesList');
  list.innerHTML='';
  notes.forEach(function(note){
    var tab=document.createElement('div');
    tab.className='note-tab'+(note.id===activeNoteId?' active':'');
    tab.innerHTML='<span class="note-tab-name">'+escHtml(note.name)+'</span>'
      +'<button class="note-tab-del" type="button" title="Delete note">×</button>';
    tab.addEventListener('click',function(){selectNote(note.id);});
    tab.querySelector('.note-tab-del').addEventListener('click',function(e){
      e.stopPropagation();deleteNote(note.id);
    });
    list.appendChild(tab);
  });
  var newBtn=document.createElement('button');
  newBtn.className='new-note-btn';newBtn.type='button';
  newBtn.innerHTML='<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> New Note';
  newBtn.addEventListener('click',createNote);
  list.appendChild(newBtn);
}

function createNote(){
  var name=prompt('Note name (e.g. "Job site 5/8" or "Sheet A2.1"):','Note '+(notes.length+1));
  if(!name)return;
  var note={id:genId(),name:name.trim(),pages:{},pageCount:1,type:'blank'};
  notes.push(note);
  saveNotes(notes);
  renderTabs();
  selectNote(note.id,true);
}

function deleteNote(id){
  if(!confirm('Delete this note?'))return;
  notes=notes.filter(function(n){return n.id!==id;});
  saveNotes(notes);
  if(activeNoteId===id){
    activeNoteId=null;pdfDoc=null;
    document.getElementById('emptyState').style.display='flex';
    document.getElementById('canvasWrap').style.display='none';
    document.getElementById('pageNav').style.display='none';
  }
  renderTabs();
}

function selectNote(id,isNew){
  activeNoteId=id;
  var note=notes.find(function(n){return n.id===id;});
  if(!note)return;
  pdfDoc=null;
  currentPage=1;
  totalPages=note.pageCount||1;
  undoStack=[];redoStack=[];
  renderTabs();
  document.getElementById('emptyState').style.display='none';
  document.getElementById('canvasWrap').style.display='block';
  if(isNew){
    // New blank note — show import options overlay on canvas
    showImportPrompt();
  } else if(note.type==='blank'||!note.pages['1']){
    showImportPrompt();
  } else {
    loadPageFromNote(note,currentPage);
  }
}

function showImportPrompt(){
  // Show the empty state actions inside the canvas area
  var es=document.getElementById('emptyState');
  es.style.display='flex';
  document.getElementById('canvasWrap').style.display='none';
  document.getElementById('pageNav').style.display='none';
}

// ── LOAD PAGE ──
function loadPageFromNote(note,pageNum){
  var pageKey=String(pageNum);
  var canvases=initCanvases();
  if(note.pages&&note.pages[pageKey]){
    var pd=note.pages[pageKey];
    var bImg=new Image();
    bImg.onload=function(){
      canvases.base.width=bImg.width;canvases.base.height=bImg.height;
      canvases.anno.width=bImg.width;canvases.anno.height=bImg.height;
      baseCtx.drawImage(bImg,0,0);
      if(pd.anno){
        var aImg=new Image();
        aImg.onload=function(){annoCtx.drawImage(aImg,0,0);};
        aImg.src=pd.anno;
      }
      fitToView(bImg.width,bImg.height);
      updatePageNav();
    };
    bImg.src=pd.base;
  }
}

function fitToView(w,h){
  var area=document.getElementById('canvasArea');
  var aw=area.clientWidth-40;
  var ah=area.clientHeight-40;
  scale=Math.min(aw/w,ah/h,1);
  panX=(area.clientWidth-w*scale)/2;
  panY=(area.clientHeight-h*scale)/2;
  applyTransform();
}

function applyTransform(){
  document.getElementById('canvasWrap').style.transform=
    'translate('+panX+'px,'+panY+'px) scale('+scale+')';
}

function updatePageNav(){
  var nav=document.getElementById('pageNav');
  nav.style.display=totalPages>1?'flex':'none';
  document.getElementById('pageLbl').textContent=currentPage+' / '+totalPages;
  document.getElementById('prevPage').disabled=currentPage<=1;
  document.getElementById('nextPage').disabled=currentPage>=totalPages;
}

// ── SAVE CURRENT PAGE ──
function saveCurrentPage(){
  if(!activeNoteId)return;
  var note=notes.find(function(n){return n.id===activeNoteId;});
  if(!note)return;
  if(!note.pages)note.pages={};
  var bc=document.getElementById('baseCanvas');
  var ac=document.getElementById('annoCanvas');
  note.pages[String(currentPage)]={
    base:bc.toDataURL('image/jpeg',0.85),
    anno:ac.toDataURL('image/png')
  };
  note.pageCount=totalPages;
  saveNotes(notes);
}

// ── IMAGE LOAD ──
function loadImage(src,noteName){
  var note=notes.find(function(n){return n.id===activeNoteId;});
  if(!note)return;
  var img=new Image();
  img.onload=function(){
    var canvases=initCanvases();
    canvases.base.width=img.width;canvases.base.height=img.height;
    canvases.anno.width=img.width;canvases.anno.height=img.height;
    baseCtx.drawImage(img,0,0);
    annoCtx.clearRect(0,0,img.width,img.height);
    document.getElementById('emptyState').style.display='none';
    document.getElementById('canvasWrap').style.display='block';
    note.type='image';totalPages=1;currentPage=1;
    pushUndo();
    saveCurrentPage();
    fitToView(img.width,img.height);
    updatePageNav();
  };
  img.src=src;
}

// ── PDF LOAD ──
function loadPdf(b64){
  if(typeof pdfjsLib==='undefined'){showToast('PDF library not loaded');return;}
  pdfjsLib.GlobalWorkerOptions.workerSrc=
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  showToast('Loading PDF...');
  var raw=atob(b64);
  var arr=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
  pdfjsLib.getDocument({data:arr}).promise.then(function(pdf){
    pdfDoc=pdf;
    totalPages=pdf.numPages;
    currentPage=1;
    renderPdfPage(currentPage);
    showToast('PDF loaded — '+totalPages+' page'+(totalPages!==1?'s':''),'green');
  }).catch(function(e){showToast('PDF error: '+e.message.slice(0,50));});
}

function renderPdfPage(pageNum){
  if(!pdfDoc)return;
  var note=notes.find(function(n){return n.id===activeNoteId;});
  if(!note)return;
  // If we have saved annotations for this page, load those
  var pageKey=String(pageNum);
  if(note.pages&&note.pages[pageKey]){
    loadPageFromNote(note,pageNum);
    return;
  }
  pdfDoc.getPage(pageNum).then(function(page){
    var viewport=page.getViewport({scale:1.5});
    var canvases=initCanvases();
    canvases.base.width=viewport.width;canvases.base.height=viewport.height;
    canvases.anno.width=viewport.width;canvases.anno.height=viewport.height;
    page.render({canvasContext:baseCtx,viewport:viewport}).promise.then(function(){
      annoCtx.clearRect(0,0,viewport.width,viewport.height);
      document.getElementById('emptyState').style.display='none';
      document.getElementById('canvasWrap').style.display='block';
      note.type='pdf';
      fitToView(viewport.width,viewport.height);
      updatePageNav();
      pushUndo();
    });
  });
}

// ── UNDO / REDO ──
function pushUndo(){
  var ac=document.getElementById('annoCanvas');
  undoStack.push(ac.toDataURL('image/png'));
  if(undoStack.length>40)undoStack.shift();
  redoStack=[];
}

function undo(){
  if(undoStack.length<2)return;
  var ac=document.getElementById('annoCanvas');
  redoStack.push(undoStack.pop());
  var img=new Image();
  img.onload=function(){annoCtx.clearRect(0,0,ac.width,ac.height);annoCtx.drawImage(img,0,0);saveCurrentPage();};
  img.src=undoStack[undoStack.length-1];
}

function redo(){
  if(!redoStack.length)return;
  var ac=document.getElementById('annoCanvas');
  var src=redoStack.pop();
  undoStack.push(src);
  var img=new Image();
  img.onload=function(){annoCtx.clearRect(0,0,ac.width,ac.height);annoCtx.drawImage(img,0,0);saveCurrentPage();};
  img.src=src;
}

// ── DRAWING ──
function getCanvasPos(e){
  var ac=document.getElementById('annoCanvas');
  var rect=ac.getBoundingClientRect();
  var clientX=e.touches?e.touches[0].clientX:e.clientX;
  var clientY=e.touches?e.touches[0].clientY:e.clientY;
  return{
    x:(clientX-rect.left)/scale,
    y:(clientY-rect.top)/scale
  };
}

function startDraw(e){
  if(currentTool==='text'){placeText(e);return;}
  e.preventDefault();
  var pos=getCanvasPos(e);
  isDrawing=true;
  lastX=pos.x;lastY=pos.y;
  if(currentTool==='arrow'){arrowStart={x:pos.x,y:pos.y};return;}
  pushUndo();
  annoCtx.beginPath();
  annoCtx.moveTo(pos.x,pos.y);
  if(currentTool==='highlight'){
    annoCtx.globalAlpha=0.35;
    annoCtx.strokeStyle=currentColor;
    annoCtx.lineWidth=currentSize*3.5;
  } else if(currentTool==='eraser'){
    annoCtx.globalCompositeOperation='destination-out';
    annoCtx.lineWidth=currentSize*4;
  } else {
    annoCtx.globalAlpha=1;
    annoCtx.strokeStyle=currentColor;
    annoCtx.lineWidth=currentSize;
  }
  annoCtx.lineCap='round';annoCtx.lineJoin='round';
}

function moveDraw(e){
  if(!isDrawing)return;
  e.preventDefault();
  var pos=getCanvasPos(e);
  if(currentTool==='arrow'){
    // Preview arrow — redraw from undo snapshot
    if(undoStack.length){
      var img=new Image();
      var src=undoStack[undoStack.length-1];
      img.onload=function(){
        var ac=document.getElementById('annoCanvas');
        annoCtx.clearRect(0,0,ac.width,ac.height);
        annoCtx.drawImage(img,0,0);
        drawArrow(arrowStart.x,arrowStart.y,pos.x,pos.y);
      };
      img.src=src;
    }
    return;
  }
  annoCtx.lineTo(pos.x,pos.y);
  annoCtx.stroke();
  lastX=pos.x;lastY=pos.y;
}

function endDraw(e){
  if(!isDrawing)return;
  isDrawing=false;
  if(currentTool==='arrow'&&arrowStart){
    var pos=getCanvasPos(e.changedTouches?{clientX:e.changedTouches[0].clientX,clientY:e.changedTouches[0].clientY}:e);
    pushUndo();
    drawArrow(arrowStart.x,arrowStart.y,pos.x,pos.y);
    arrowStart=null;
  }
  annoCtx.globalAlpha=1;
  annoCtx.globalCompositeOperation='source-over';
  saveCurrentPage();
}

function drawArrow(x1,y1,x2,y2){
  var headlen=Math.min(20,currentSize*4);
  var angle=Math.atan2(y2-y1,x2-x1);
  annoCtx.save();
  annoCtx.strokeStyle=currentColor;
  annoCtx.fillStyle=currentColor;
  annoCtx.lineWidth=currentSize;
  annoCtx.lineCap='round';
  annoCtx.beginPath();
  annoCtx.moveTo(x1,y1);annoCtx.lineTo(x2,y2);
  annoCtx.stroke();
  annoCtx.beginPath();
  annoCtx.moveTo(x2,y2);
  annoCtx.lineTo(x2-headlen*Math.cos(angle-Math.PI/6),y2-headlen*Math.sin(angle-Math.PI/6));
  annoCtx.lineTo(x2-headlen*Math.cos(angle+Math.PI/6),y2-headlen*Math.sin(angle+Math.PI/6));
  annoCtx.closePath();annoCtx.fill();
  annoCtx.restore();
}

// ── TEXT TOOL ──
function placeText(e){
  var pos=getCanvasPos(e);
  var ac=document.getElementById('annoCanvas');
  var wrap=document.getElementById('canvasWrap');
  var wrapRect=wrap.getBoundingClientRect();
  var overlay=document.getElementById('textOverlay');
  overlay.style.left=(pos.x*scale+wrapRect.left-document.getElementById('canvasArea').getBoundingClientRect().left)+'px';
  overlay.style.top=(pos.y*scale+wrapRect.top-document.getElementById('canvasArea').getBoundingClientRect().top)+'px';
  overlay.style.display='block';
  overlay.value='';
  overlay.focus();
  overlay.onkeydown=function(ev){
    if(ev.key==='Enter'&&!ev.shiftKey){
      ev.preventDefault();commitText(pos.x,pos.y,overlay.value);
      overlay.style.display='none';
    }
    if(ev.key==='Escape'){overlay.style.display='none';}
  };
  overlay.onblur=function(){
    if(overlay.value.trim())commitText(pos.x,pos.y,overlay.value);
    overlay.style.display='none';
  };
}

function commitText(x,y,text){
  if(!text.trim())return;
  pushUndo();
  var fontSize=Math.max(14,currentSize*4);
  annoCtx.save();
  annoCtx.font='bold '+fontSize+'px '+getComputedStyle(document.body).getPropertyValue('--body');
  annoCtx.fillStyle=currentColor;
  annoCtx.strokeStyle='rgba(0,0,0,0.6)';
  annoCtx.lineWidth=fontSize*0.08;
  text.split('\n').forEach(function(line,i){
    annoCtx.strokeText(line,x,y+i*fontSize*1.3);
    annoCtx.fillText(line,x,y+i*fontSize*1.3);
  });
  annoCtx.restore();
  saveCurrentPage();
}

// ── EXPORT ──
function exportNote(){
  if(!activeNoteId){showToast('No note to export');return;}
  saveCurrentPage();
  var note=notes.find(function(n){return n.id===activeNoteId;});
  if(!note||!note.pages||!note.pages['1']){showToast('Nothing to export');return;}
  // Flatten base + annotations onto a single canvas
  var bc=document.getElementById('baseCanvas');
  var ac=document.getElementById('annoCanvas');
  var flat=document.createElement('canvas');
  flat.width=bc.width;flat.height=bc.height;
  var ctx=flat.getContext('2d');
  ctx.drawImage(bc,0,0);
  ctx.drawImage(ac,0,0);
  var fname=(note.name||'FieldNote').replace(/[^a-z0-9]/gi,'-')+'-p'+currentPage+'.jpg';
  var url=flat.toDataURL('image/jpeg',0.92);
  var a=document.createElement('a');a.href=url;a.download=fname;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  showToast('Saved: '+fname,'green');
}

// ── PINCH TO ZOOM & PAN ──
var lastDist=0,lastPinchScale=1;
function getEventDist(e){
  var t=e.touches;
  return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
}
var isPanning=false,panStartX=0,panStartY=0,panStartPX=0,panStartPY=0;

document.getElementById('canvasArea').addEventListener('touchstart',function(e){
  if(e.touches.length===2){lastDist=getEventDist(e);lastPinchScale=scale;isPanning=false;}
  else if(e.touches.length===1&&currentTool!=='pen'&&currentTool!=='highlight'&&currentTool!=='eraser'){
    // Single finger pan when not drawing
    isPanning=false;
  }
},{passive:false});

document.getElementById('canvasArea').addEventListener('touchmove',function(e){
  if(e.touches.length===2){
    e.preventDefault();
    var d=getEventDist(e);
    scale=Math.max(0.2,Math.min(5,lastPinchScale*(d/lastDist)));
    applyTransform();
  }
},{passive:false});

// ── WIRE EVENTS ──
var ac=document.getElementById('annoCanvas');
ac.addEventListener('mousedown',startDraw);
ac.addEventListener('mousemove',moveDraw);
ac.addEventListener('mouseup',endDraw);
ac.addEventListener('mouseleave',function(e){if(isDrawing)endDraw(e);});
ac.addEventListener('touchstart',startDraw,{passive:false});
ac.addEventListener('touchmove',moveDraw,{passive:false});
ac.addEventListener('touchend',endDraw,{passive:false});

// Wheel zoom
document.getElementById('canvasArea').addEventListener('wheel',function(e){
  e.preventDefault();
  var delta=e.deltaY>0?0.9:1.1;
  scale=Math.max(0.1,Math.min(8,scale*delta));
  applyTransform();
},{passive:false});

// ── FILE INPUTS ──
document.getElementById('pdfInput').addEventListener('change',function(e){
  var file=e.target.files[0];if(!file)return;
  if(!activeNoteId)createNote();
  var reader=new FileReader();
  reader.onload=function(ev){
    var b64=ev.target.result.split(',')[1];
    loadPdf(b64);
  };
  reader.readAsDataURL(file);
  e.target.value='';
});

function handleImgFile(file){
  if(!file)return;
  if(!activeNoteId)createNote();
  var reader=new FileReader();
  reader.onload=function(ev){loadImage(ev.target.result);};
  reader.readAsDataURL(file);
}

document.getElementById('imgInput').addEventListener('change',function(e){handleImgFile(e.target.files[0]);e.target.value='';});
document.getElementById('imgUpload').addEventListener('change',function(e){handleImgFile(e.target.files[0]);e.target.value='';});

// ── TOOLBAR ──
function setTool(t){
  currentTool=t;
  ['toolPen','toolHighlight','toolText','toolArrow','toolEraser'].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.classList.toggle('active',id==='tool'+t.charAt(0).toUpperCase()+t.slice(1));
  });
  var ac=document.getElementById('annoCanvas');
  ac.style.cursor=t==='eraser'?'cell':t==='text'?'text':'crosshair';
}

document.getElementById('toolPen').addEventListener('click',function(){setTool('pen');});
document.getElementById('toolHighlight').addEventListener('click',function(){setTool('highlight');});
document.getElementById('toolText').addEventListener('click',function(){setTool('text');});
document.getElementById('toolArrow').addEventListener('click',function(){setTool('arrow');});
document.getElementById('toolEraser').addEventListener('click',function(){setTool('eraser');});

// Colors
var colors={'colorRed':'#e05252','colorBlack':'#f0ede8','colorYellow':'#f5c842','colorBlue':'#4a90d9','colorGreen':'#34a872','colorOrange':'#E8622A'};
Object.keys(colors).forEach(function(id){

var sizes={'sizeS':2,'sizeM':4,'sizeL':8};
Object.keys(sizes).forEach(function(id){

    currentSize=sizes[id];

document.getElementById('undoBtn').addEventListener('click',undo);
document.getElementById('redoBtn').addEventListener('click',redo);
document.getElementById('exportBtn').addEventListener('click',exportNote);

document.getElementById('prevPage').addEventListener('click',function(){
  if(currentPage<=1)return;
  saveCurrentPage();currentPage--;
  if(pdfDoc)renderPdfPage(currentPage);else{
    var note=notes.find(function(n){return n.id===activeNoteId;});
    if(note)loadPageFromNote(note,currentPage);
  }
  updatePageNav();
});
document.getElementById('nextPage').addEventListener('click',function(){
  if(currentPage>=totalPages)return;
  saveCurrentPage();currentPage++;
  if(pdfDoc)renderPdfPage(currentPage);else{
    var note=notes.find(function(n){return n.id===activeNoteId;});
    if(note)loadPageFromNote(note,currentPage);
  }
  updatePageNav();
});
