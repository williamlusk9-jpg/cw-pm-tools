<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#161618">
<title>Field Notes — C&W</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#161618;--sb:#1c1c1e;--s1:#222224;--s2:#2c2c2e;--s3:#3a3a3c;
  --b1:#2c2c2e;--b2:#3a3a3c;--b3:#48484a;
  --accent:#E8622A;--accent-dim:rgba(232,98,42,.14);
  --green:#34c759;--green-dim:rgba(52,199,89,.12);
  --blue:#0a84ff;--blue-dim:rgba(10,132,255,.12);
  --red:#ff453a;--red-dim:rgba(255,69,58,.12);
  --yellow:#ffd60a;
  --tx1:#f2f2f7;--tx2:#aeaeb2;--tx3:#636366;--tx4:#3a3a3c;
  --mono:'DM Mono',monospace;--disp:'Syne',sans-serif;--body:'DM Sans',sans-serif;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
  --cw-sb-w:0px;
  --home-sb-w:260px;
  --topbar-h:52px;
  --strip-h:84px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--tx1);font-family:var(--body);-webkit-font-smoothing:antialiased}

/* ════════════════════════════════════════════
   CW SUITE SIDEBAR (desktop)
════════════════════════════════════════════ */
.cw-sidebar{display:none;width:200px;background:#141414;border-right:1px solid #1e1e1e;flex-direction:column;position:fixed;top:0;left:0;height:100%;z-index:100;transition:transform .22s ease}
.cw-sidebar.hidden{transform:translateX(-100%)}
.cw-sb-hdr{padding:20px 14px 14px;border-bottom:1px solid #1e1e1e;display:flex;align-items:center;gap:9px}
.cw-pill{width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cw-brand{font-family:var(--disp);font-size:13px;font-weight:700}
.cw-brand-sub{font-family:var(--mono);font-size:9px;color:#444;text-transform:uppercase;letter-spacing:.07em}
.cw-nav{padding:8px 6px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.cw-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;text-decoration:none;color:#636366;font-size:12px;font-weight:500;transition:all .12s;border:1px solid transparent}
.cw-item:hover{background:#1a1a1a;color:var(--tx1)}
.cw-item.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(232,98,42,.15)}
.cw-icon{width:14px;height:14px;flex-shrink:0}
.cw-foot{padding:10px 14px;border-top:1px solid #1e1e1e}
.cw-date{font-family:var(--mono);font-size:10px;color:#3a3a3c}
@media(min-width:768px){.cw-sidebar{display:flex}}

/* ════════════════════════════════════════════
   HOME SCREEN
════════════════════════════════════════════ */
#homeScreen{position:fixed;inset:0;display:flex;flex-direction:column;z-index:10;transition:opacity .2s}
#homeScreen.hidden{display:none}
@media(min-width:768px){#homeScreen{left:200px}}

/* ─── Mobile top bar ─── */
.hm-topbar{height:calc(var(--topbar-h) + var(--safe-top));padding-top:var(--safe-top);background:var(--sb);border-bottom:1px solid var(--b1);display:flex;align-items:center;padding-left:14px;padding-right:14px;gap:10px;flex-shrink:0;z-index:10}
.hm-logo{display:flex;align-items:center;gap:8px}
.hm-logo-pill{width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hm-logo-name{font-family:var(--disp);font-size:16px;font-weight:700}
.hm-topbar-search{flex:1;display:flex;align-items:center;gap:7px;background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:8px 12px;max-width:320px}
.hm-topbar-search input{background:transparent;border:none;outline:none;color:var(--tx1);font-size:13px;font-family:var(--body);flex:1;min-width:0}
.hm-topbar-search input::placeholder{color:var(--tx3)}
.hm-topbar-actions{display:flex;gap:6px;margin-left:auto}
.hm-icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--b1);background:var(--s2);color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.hm-icon-btn:hover{color:var(--tx1);background:var(--s3)}
.hm-icon-btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.hm-icon-btn.accent:hover{opacity:.9}

/* ─── Body: jobs sidebar + note grid ─── */
.hm-body{flex:1;display:flex;overflow:hidden}

/* Jobs panel */
.hm-jobs{width:var(--home-sb-w);background:var(--sb);border-right:1px solid var(--b1);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .2s ease}
.hm-jobs.collapsed{width:0}
.hm-jobs-hdr{padding:14px 14px 10px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hm-jobs-lbl{font-family:var(--disp);font-size:14px;font-weight:700;color:var(--tx1)}
.hm-new-job{width:28px;height:28px;border-radius:8px;border:1px solid var(--b2);background:transparent;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.hm-new-job:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.hm-job-list{flex:1;overflow-y:auto;padding:8px}
.hm-job-item{border-radius:12px;overflow:hidden;cursor:pointer;margin-bottom:6px;border:1.5px solid transparent;transition:all .15s;background:var(--s1)}
.hm-job-item:hover{border-color:var(--b2)}
.hm-job-item.active{border-color:var(--accent);background:var(--s2)}
.hm-job-thumb-row{display:flex;height:60px;gap:1px;overflow:hidden}
.hm-job-thumb{flex:1;background:var(--s3);overflow:hidden}
.hm-job-thumb img{width:100%;height:100%;object-fit:cover}
.hm-job-thumb-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--tx4);font-size:14px}
.hm-job-info{padding:9px 11px 10px;display:flex;align-items:center;gap:6px}
.hm-job-name{font-size:12px;font-weight:600;color:var(--tx1);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-job-ct{font-family:var(--mono);font-size:9px;color:var(--tx3);background:var(--s3);border-radius:5px;padding:2px 6px;flex-shrink:0}
.hm-job-issue{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0}
.hm-jobs-foot{padding:10px 12px;border-top:1px solid var(--b1);display:flex;align-items:center;gap:8px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--tx4);flex-shrink:0;transition:background .3s}
.sync-lbl{font-family:var(--mono);font-size:10px;color:var(--tx3);flex:1}
.sync-pull-btn{font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:6px;border:1px solid var(--b2);background:transparent;color:var(--tx3);cursor:pointer;transition:all .12s}
.sync-pull-btn:hover{color:var(--tx1);border-color:var(--b2)}

/* Main grid area */
.hm-grid-area{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

/* Filter chips */
.hm-filters{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--b1);flex-shrink:0;overflow-x:auto;scrollbar-width:none;background:var(--bg)}
.hm-filters::-webkit-scrollbar{display:none}
.hm-filter-chip{padding:6px 14px;border-radius:20px;border:1px solid var(--b1);background:transparent;color:var(--tx3);font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;white-space:nowrap;transition:all .12s;flex-shrink:0}
.hm-filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.hm-filter-chip:hover:not(.active){border-color:var(--b2);color:var(--tx2)}
.hm-filter-chip.issue{border-color:rgba(255,69,58,.3)}
.hm-filter-chip.issue.active{background:var(--red);border-color:var(--red)}

/* Note grid */
.hm-notes-grid{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;align-content:start}
.hm-section-date{grid-column:1/-1;font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);padding:6px 2px 2px;margin-top:4px}
.hm-section-date:first-child{margin-top:0}

/* Note card */
.note-card{background:var(--s1);border:1.5px solid var(--b1);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .15s;position:relative}
.note-card:hover{border-color:var(--b2);transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.note-card.flagged{border-color:rgba(255,69,58,.4)}
.note-card-thumb{width:100%;aspect-ratio:4/3;background:var(--s2);overflow:hidden;position:relative}
.note-card-thumb img,.note-card-thumb canvas{width:100%;height:100%;object-fit:cover;display:block}
.note-card-thumb-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--s2)}
.note-card-type-badge{position:absolute;top:7px;left:7px;padding:3px 8px;border-radius:6px;font-family:var(--mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;backdrop-filter:blur(8px)}
.badge-photo{background:rgba(10,132,255,.7);color:#fff}
.badge-plan{background:rgba(232,98,42,.8);color:#fff}
.badge-sketch{background:rgba(52,199,89,.7);color:#fff}
.note-card-issue{position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--red);border:1.5px solid rgba(255,255,255,.3)}
.note-card-pages{position:absolute;bottom:7px;right:7px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);border-radius:5px;padding:2px 6px;font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.8)}
.note-card-body{padding:9px 11px 11px}
.note-card-name{font-size:13px;font-weight:600;color:var(--tx1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-card-meta{font-family:var(--mono);font-size:10px;color:var(--tx4);margin-top:2px}
.note-card-menu{position:absolute;top:38px;right:7px;width:26px;height:26px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);border-radius:7px;display:none;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.8);font-size:14px;font-weight:700;line-height:1;border:none}
.note-card:hover .note-card-menu{display:flex}

/* Empty state */
.hm-empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:10px;text-align:center}
.hm-empty-icon{font-size:44px;opacity:.35}
.hm-empty-title{font-size:16px;font-weight:600;color:var(--tx2)}
.hm-empty-sub{font-size:13px;color:var(--tx4);line-height:1.6}
.hm-empty-btn{padding:12px 22px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;transition:opacity .15s;margin-top:6px}
.hm-empty-btn:hover{opacity:.88}

/* No job selected */
.hm-no-job{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--tx4);text-align:center;padding:40px}
.hm-no-job-icon{font-size:48px;opacity:.3}
.hm-no-job-title{font-size:15px;font-weight:600;color:var(--tx2)}
.hm-no-job-sub{font-size:13px;line-height:1.5}

/* FAB */
.fab{position:absolute;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(232,98,42,.45);z-index:50;transition:all .2s;-webkit-tap-highlight-color:transparent}
.fab:hover{opacity:.9;transform:scale(1.05)}
.fab.open{transform:rotate(45deg)}
.fab-menu{position:absolute;bottom:68px;right:0;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;opacity:0;transform:translateY(10px);transition:all .2s}
.fab-menu.show{pointer-events:all;opacity:1;transform:translateY(0)}
.fab-item{display:flex;align-items:center;gap:10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fab-item-label{background:var(--sb);border:1px solid var(--b2);border-radius:9px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--tx1);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.fab-item-icon{width:44px;height:44px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.3)}

/* Context menu */
.ctx-menu{position:fixed;background:var(--sb);border:1px solid var(--b2);border-radius:14px;padding:6px;z-index:9999;box-shadow:0 12px 40px rgba(0,0,0,.7);min-width:180px;display:none}
.ctx-menu.show{display:block}
.ctx-item{padding:10px 13px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--tx1);display:flex;align-items:center;gap:9px;transition:background .1s}
.ctx-item:hover{background:var(--s3)}
.ctx-item.danger{color:var(--red)}

/* ════════════════════════════════════════════
   EDITOR SCREEN — Notability style
════════════════════════════════════════════ */
#editorScreen{position:fixed;inset:0;display:flex;flex-direction:column;z-index:200;background:#111;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#editorScreen.hidden{display:none}

/* Editor topbar — tools live here */
.ed-topbar{height:calc(50px + var(--safe-top));padding-top:var(--safe-top);background:rgba(22,22,24,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:0;padding-left:4px;padding-right:8px;flex-shrink:0;z-index:10;overflow:hidden}
/* Back button */
.ed-back{display:flex;align-items:center;gap:3px;color:var(--blue);font-size:14px;font-weight:600;cursor:pointer;padding:6px 10px;border-radius:9px;transition:background .12s;border:none;background:none;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.ed-back:active{background:rgba(10,132,255,.15)}
/* Divider */
.ed-div{width:1px;height:26px;background:rgba(255,255,255,.08);flex-shrink:0;margin:0 2px}
/* Tool group */
.ed-tools{display:flex;align-items:center;gap:1px;flex-shrink:0}
.tool-btn{width:40px;height:40px;border-radius:10px;border:none;background:transparent;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.tool-btn:active{background:rgba(255,255,255,.08)}
.tool-btn.active{background:var(--accent-dim);color:var(--accent)}
/* Color row */
.ed-colors{display:flex;align-items:center;gap:5px;padding:0 4px;flex-shrink:0}
.color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:transform .12s,border-color .12s;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.color-dot.active{border-color:rgba(255,255,255,.7);transform:scale(1.2)}
/* Size row */
.ed-sizes{display:flex;align-items:center;gap:3px;padding:0 2px;flex-shrink:0}
.sz-btn{padding:4px 9px;border-radius:7px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--tx3);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .12s;flex-shrink:0}
.sz-btn.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(232,98,42,.35)}
/* Right actions */
.ed-actions{display:flex;align-items:center;gap:2px;margin-left:auto;flex-shrink:0}
/* Title centered */
.ed-title-wrap{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none}
.ed-title{font-size:14px;font-weight:600;color:var(--tx1);white-space:nowrap;cursor:pointer;pointer-events:all}
.ed-title:active{opacity:.7}
/* Flag badge on title */
.ed-flag{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:6px;vertical-align:middle}

/* Canvas area */
.ed-canvas-area{flex:1;position:relative;overflow:hidden;background:#1a1a1a;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ed-canvas-area *{-webkit-touch-callout:none !important;-webkit-user-select:none !important;user-select:none !important}
.canvas-wrap{position:absolute;transform-origin:0 0;will-change:transform}
#baseCanvas{display:block;background:#fff}
#annoCanvas{position:absolute;top:0;left:0;touch-action:none;-webkit-user-select:none;user-select:none}

/* Eraser mode popup */
.eraser-popup{position:absolute;top:calc(50px + var(--safe-top) + 8px);left:50%;transform:translateX(-50%);background:var(--sb);border:1px solid var(--b2);border-radius:13px;padding:6px;display:none;gap:6px;z-index:500;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.eraser-popup.show{display:flex}
.eraser-opt{padding:9px 16px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--tx1);display:flex;align-items:center;gap:7px;transition:background .12s;border:none;background:transparent}
.eraser-opt.active{background:var(--accent-dim);color:var(--accent)}

/* Page strip */
.ed-page-strip{height:var(--strip-h);background:rgba(22,22,24,.95);border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:8px;padding:0 12px;overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:max(0px,var(--safe-bot))}
.ed-page-strip::-webkit-scrollbar{display:none}
.pg-thumb{width:58px;height:68px;border-radius:8px;overflow:hidden;border:2.5px solid transparent;cursor:pointer;flex-shrink:0;background:var(--s2);position:relative;transition:border-color .15s;-webkit-tap-highlight-color:transparent}
.pg-thumb.active{border-color:var(--blue)}
.pg-thumb img,.pg-thumb canvas{width:100%;height:100%;object-fit:cover;display:block}
.pg-thumb-num{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:8px;color:rgba(255,255,255,.5)}
.pg-thumb-add{width:58px;height:68px;border-radius:8px;border:2px dashed rgba(255,255,255,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--tx3);transition:all .15s;gap:3px;font-family:var(--mono);font-size:8px}
.pg-thumb-add:hover,.pg-thumb-add:active{border-color:var(--blue);color:var(--blue)}

/* Text overlay */
.text-overlay{position:absolute;background:transparent;border:1.5px dashed rgba(255,255,255,.35);border-radius:4px;padding:4px 6px;font-family:var(--body);font-size:16px;color:#fff;outline:none;resize:none;min-width:100px;min-height:28px;z-index:20;display:none;line-height:1.4;-webkit-user-select:text !important;user-select:text !important}

/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:8000;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px)}
.modal-back.show{display:flex}
.modal{background:var(--s1);border-radius:20px 20px 0 0;padding:22px 18px calc(22px + var(--safe-bot));width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px}
.modal-title{font-family:var(--disp);font-size:18px;font-weight:700}
.modal-input{background:var(--bg);border:1px solid var(--b2);border-radius:11px;color:var(--tx1);font-family:var(--body);font-size:15px;padding:12px 14px;outline:none;width:100%}
.modal-input:focus{border-color:var(--blue)}
.modal-btns{display:flex;gap:8px}
.modal-btn{flex:1;padding:13px;border-radius:12px;border:none;font-family:var(--body);font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
.modal-btn.primary{background:var(--blue);color:#fff}
.modal-btn.cancel{background:var(--s3);color:var(--tx2)}
.modal-btn:hover{opacity:.85}

/* Toast */
.toast{position:fixed;bottom:calc(var(--strip-h) + 10px);left:50%;transform:translateX(-50%) translateY(10px);background:var(--s2);border:1px solid var(--b2);border-radius:12px;padding:10px 18px;font-size:12px;font-family:var(--mono);color:var(--tx1);opacity:0;transition:all .25s;pointer-events:none;z-index:9000;white-space:nowrap}
#homeScreen .toast,.toast.home-toast{bottom:20px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.green{border-color:var(--green);color:var(--green)}
.toast.blue{border-color:var(--blue);color:var(--blue)}

/* Offline banner */

<script>
'use strict';

// ══ STORAGE ══
function getFolders(){try{return JSON.parse(localStorage.getItem('fn-jobs')||'[]');}catch(e){return[];}} function getJobs(){return getFolders();}
function saveFolders(f){try{localStorage.setItem('fn-jobs',JSON.stringify(f));}catch(e){} schedulePush();} function saveJobs(j){saveFolders(j);}
function getNotes(){try{return JSON.parse(localStorage.getItem('fn-notes')||'[]');}catch(e){return[];}}
function saveNotes(n){
  try{localStorage.setItem('fn-notes',JSON.stringify(n));}catch(e){showToast('Storage full — export notes to free space');}
  schedulePush();
}
function saveFoldersThenPush(f){
  try{localStorage.setItem('fn-folders',JSON.stringify(f));}catch(e){}
  schedulePush();
}

// ── GITHUB SYNC ──
var GH_OWNER='williamlusk9-jpg',GH_REPO='cw-pm-tools',GH_BRANCH='main';
var GH_FILE='field-notes.json';
var _pushTimer=null;
function getToken(){return localStorage.getItem('cw-gh-token')||'';}
function schedulePush(){clearTimeout(_pushTimer);_pushTimer=setTimeout(pushToGitHub,4000);}

function pushToGitHub(){
  var token=getToken();if(!token)return;
  showSyncDot('pending');
  var payload=JSON.stringify({folders:getFolders(),notes:getNotes(),_syncedAt:Date.now()});
  var b64=btoa(unescape(encodeURIComponent(payload)));
  var url='https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_FILE;
  // Get current SHA first
  fetch(url+'?ref='+GH_BRANCH,{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}})
  .then(function(r){return r.ok?r.json():null;})
  .then(function(data){
    var body={message:'Field Notes sync '+new Date().toISOString(),content:b64,branch:GH_BRANCH};
    if(data&&data.sha)body.sha=data.sha;
    return fetch(url,{method:'PUT',headers:{'Authorization':'token '+token,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify(body)});
  })
  .then(function(r){if(r&&r.ok)showSyncDot('ok');else showSyncDot('err');})
  .catch(function(){showSyncDot('err');});
}

function pullFromGitHub(){
  var token=getToken();if(!token)return;
  var url='https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_FILE+'?ref='+GH_BRANCH;
  fetch(url,{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}})
  .then(function(r){return r.ok?r.json():null;})
  .then(function(data){
    if(!data||!data.content)return;
    var decoded=decodeURIComponent(escape(atob(data.content.replace(/\n/g,''))));
    var parsed=JSON.parse(decoded);
    if(parsed.notes){
      var remote=parsed.notes;var local=getNotes();
      var remoteSyncedAt=parsed._syncedAt||0;
      var remoteMap={};remote.forEach(function(n){remoteMap[n.id]=n;});
      var merged=remote.slice();
      local.forEach(function(n){
        if(!remoteMap[n.id]){
          var mod=n.updatedAt||n.createdAt||0;
          if(mod>remoteSyncedAt)merged.push(n);
        } else {
          var ri=merged.findIndex(function(r){return r.id===n.id;});
          if(ri>-1&&(n.updatedAt||0)>(merged[ri].updatedAt||0))merged[ri]=n;
        }
      });
      try{localStorage.setItem('fn-notes',JSON.stringify(merged));}catch(e){}
      notes=merged;
    }
    if(parsed.folders){
      folders=parsed.folders;
      try{localStorage.setItem('fn-folders',JSON.stringify(folders));}catch(e){}
    }
    renderNav();renderGrid();
    showSyncDot('ok');showToast('Synced from GitHub','green');
  })
  .catch(function(){showSyncDot('err');});
}

if(njb)njb.addEventListener('click',async function(){

  folders.push(job);saveFolders(folders);renderNav();
  selectJob(job.id);showToast('Job added','green');

document.querySelectorAll('.filter-chip').forEach(function(chip){

// CW sidebar toggle removed - sidebar auto-hides on editor open




function showSyncDot(state){
  var dot=document.getElementById('syncDot');
  var lbl=document.getElementById('syncLblFn');
  if(!dot)return;
  if(state==='ok'){
    dot.style.background='var(--green)';
    if(lbl)lbl.textContent='Synced';
  } else if(state==='err'){
    dot.style.background='var(--red)';
    if(lbl)lbl.textContent='Sync error';
  } else if(state==='pending'){
    dot.style.background='var(--accent)';
    if(lbl)lbl.textContent='Saving...';
  } else {
    dot.style.background='var(--tx3)';
    if(lbl)lbl.textContent='Not connected';
  }
  setTimeout(function(){
    if(state==='ok'||state==='err'){
      dot.style.background='var(--tx3)';
      if(lbl)lbl.textContent='';
    }
  },3000);
}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

// ══ TOAST ══
var _tt;
function showToast(msg,style){
  var t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show'+(style?' '+style:'');
  clearTimeout(_tt);_tt=setTimeout(function(){t.className='toast';},3000);
}

// ══ LOAD PAGE ══
function getCanvases(){
  return{base:document.getElementById('baseCanvas'),anno:document.getElementById('annoCanvas'),
    baseCtx:document.getElementById('baseCanvas').getContext('2d'),
    annoCtx:document.getElementById('annoCanvas').getContext('2d')};
}

function loadPage(pageIdx){
  var note=notes.find(function(n){return n.id===activeNoteId;});
  if(!note||!note.pages)return;
  var pg=note.pages[pageIdx];
  var cv=getCanvases();
  strokes=(pg&&pg.strokes)?pg.strokes.map(function(s){return JSON.parse(JSON.stringify(s));}):[];
  if(pg&&pg.base){
    var bImg=new Image();
    bImg.onload=function(){
      cv.base.width=bImg.naturalWidth;cv.base.height=bImg.naturalHeight;
      cv.anno.width=bImg.naturalWidth;cv.anno.height=bImg.naturalHeight;
      cv.baseCtx.drawImage(bImg,0,0);
      cv.annoCtx.clearRect(0,0,cv.anno.width,cv.anno.height);
      if(pg.anno){var ai=new Image();ai.onload=function(){cv.annoCtx.drawImage(ai,0,0);};ai.src=pg.anno;}
      document.getElementById('canvasWrap').style.display='block';
      fitToView(bImg.naturalWidth,bImg.naturalHeight);
      pushUndo();
    };
    bImg.src=pg.base;
  } else {
    // Blank page
    var W=1024,H=768;
    cv.base.width=W;cv.base.height=H;cv.anno.width=W;cv.anno.height=H;
    cv.baseCtx.fillStyle='#ffffff';cv.baseCtx.fillRect(0,0,W,H);
    cv.annoCtx.clearRect(0,0,W,H);
    document.getElementById('canvasWrap').style.display='block';
    fitToView(W,H);
    pushUndo();
  }
  renderPageStrip();
}

function fitToView(w,h){
  var area=document.getElementById('edCanvasArea');
  var aw=area.clientWidth-32,ah=area.clientHeight-32;
  scale=Math.min(aw/w,ah/h,2);
  panX=(area.clientWidth-w*scale)/2;
  panY=(area.clientHeight-h*scale)/2;
  applyTransform();
}
function applyTransform(){
  document.getElementById('canvasWrap').style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')';
}

// ══ SAVE PAGE ══
function saveCurrentPage(){

// ══ UNDO / REDO ══
function pushUndo(){
  var ac=document.getElementById('annoCanvas');
  undoStack.push(ac.toDataURL('image/png'));
  if(undoStack.length>50)undoStack.shift();
  redoStack=[];
}
function undo(){
  if(undoStack.length<2)return;
  var ac=document.getElementById('annoCanvas');
  var ac_ctx=ac.getContext('2d');
  redoStack.push(undoStack.pop());
  var img=new Image();
  img.onload=function(){ac_ctx.clearRect(0,0,ac.width,ac.height);ac_ctx.drawImage(img,0,0);saveCurrentPage();};
  img.src=undoStack[undoStack.length-1];
}
function redo(){
  if(!redoStack.length)return;
  var ac=document.getElementById('annoCanvas');
  var ac_ctx=ac.getContext('2d');
  var src=redoStack.pop();undoStack.push(src);
  var img=new Image();
  img.onload=function(){ac_ctx.clearRect(0,0,ac.width,ac.height);ac_ctx.drawImage(img,0,0);saveCurrentPage();};
  img.src=src;
}

// ══ DRAWING ══
// Use Pointer Events API for Apple Pencil support
// getCoalescedEvents() recovers every intermediate Pencil position iOS would otherwise drop

function getPosFromEvent(e){
  var ac=document.getElementById('annoCanvas');
  var rect=ac.getBoundingClientRect();
  return{x:(e.clientX-rect.left)/scale, y:(e.clientY-rect.top)/scale};
}

// Smoothing: draw quadratic bezier through midpoints instead of raw lineTo
// This eliminates the jagged appearance from sparse touch events
function drawSmoothSegment(ctx, x0,y0, x1,y1){
  // Midpoint bezier — feels like natural handwriting
  var mx=(x0+x1)/2, my=(y0+y1)/2;
  ctx.quadraticCurveTo(x0,y0,mx,my);
}

var _lastDrawX=0,_lastDrawY=0;

function startDraw(e){
  if(e.target.id!=='annoCanvas')return;
  // Ignore multi-pointer pinch
  if(e.type==='pointerdown'&&e.isPrimary===false)return;
  // Palm rejection: if a Pencil stroke is in progress, ignore all finger touches
  if(e.pointerType==='touch'&&pencilActive)return;
  // Track when Apple Pencil goes down so we can block palm
  if(e.pointerType==='pen')pencilActive=true;
  if(currentTool==='text'){placeText(e);return;}
  e.preventDefault();
  isDrawing=true;
  var pos=getPosFromEvent(e);
  _lastDrawX=pos.x; _lastDrawY=pos.y;
  var ac_ctx=document.getElementById('annoCanvas').getContext('2d');

  if(currentTool==='eraser'){
    if(eraserMode==='stroke'){removeNearStrokes(pos.x,pos.y);return;}
    ac_ctx.globalCompositeOperation='destination-out';
    ac_ctx.lineWidth=currentSize*5;
    ac_ctx.lineCap='round';
    ac_ctx.beginPath();
    ac_ctx.moveTo(pos.x,pos.y);
    return;
  }

  pushUndo();
  currentStroke={tool:currentTool,color:currentColor,size:currentSize,points:[{x:pos.x,y:pos.y}]};
  if(currentTool==='arrow'){arrowStart={x:pos.x,y:pos.y};return;}

  // Apply pressure sensitivity from Apple Pencil if available
  var pressure=e.pressure||1;
  var lineW=(currentTool==='highlight')?(currentSize*4):(currentSize*(0.5+pressure*0.8));

  if(currentTool==='highlight'){ac_ctx.globalAlpha=0.35;ac_ctx.strokeStyle=currentColor;ac_ctx.lineWidth=lineW;}
  else{ac_ctx.globalAlpha=1;ac_ctx.strokeStyle=currentColor;ac_ctx.lineWidth=lineW;}
  ac_ctx.lineCap='round';ac_ctx.lineJoin='round';
  ac_ctx.beginPath();
  ac_ctx.moveTo(pos.x,pos.y);
}

function processPoint(e, ac_ctx, ac){
  var pos=getPosFromEvent(e);
  if(currentTool==='eraser'){
    if(eraserMode==='stroke'){removeNearStrokes(pos.x,pos.y);return;}
    ac_ctx.lineTo(pos.x,pos.y);ac_ctx.stroke();
    ac_ctx.beginPath();ac_ctx.moveTo(pos.x,pos.y);
    _lastDrawX=pos.x;_lastDrawY=pos.y;
    return;
  }
  if(currentTool==='arrow')return;

  if(currentStroke)currentStroke.points.push({x:pos.x,y:pos.y});

  // Update pressure-sensitive width
  var pressure=e.pressure||1;
  if(pressure>0&&currentTool!=='highlight'){
    ac_ctx.lineWidth=currentSize*(0.5+pressure*0.8);
  }

  // Smooth bezier segment
  drawSmoothSegment(ac_ctx, _lastDrawX, _lastDrawY, pos.x, pos.y);
  ac_ctx.stroke();
  ac_ctx.beginPath();
  ac_ctx.moveTo(((_lastDrawX+pos.x)/2), ((_lastDrawY+pos.y)/2));

  _lastDrawX=pos.x;_lastDrawY=pos.y;
}

function moveDraw(e){
  if(!isDrawing)return;
  if(e.type==='pointermove'&&e.isPrimary===false)return;
  if(e.pointerType==='touch'&&pencilActive)return;
  e.preventDefault();

  var ac=document.getElementById('annoCanvas');
  var ac_ctx=ac.getContext('2d');

  if(currentTool==='arrow'){
    var pos=getPosFromEvent(e);
    if(undoStack.length){
      var img=new Image();
      img.onload=function(){ac_ctx.clearRect(0,0,ac.width,ac.height);ac_ctx.drawImage(img,0,0);drawArrowShape(arrowStart.x,arrowStart.y,pos.x,pos.y);};
      img.src=undoStack[undoStack.length-1];
    }
    return;
  }

  // getCoalescedEvents() gives every intermediate Pencil position iOS batched together
  // This is the key fix — without it, fast strokes drop most points
  var events=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(var i=0;i<events.length;i++){
    processPoint(events[i], ac_ctx, ac);
  }
}

function endDraw(e){
  if(!isDrawing){
    // Even if not drawing, release pencilActive when pencil lifts
    if(e.pointerType==='pen')pencilActive=false;
    return;
  }
  isDrawing=false;
  if(e.pointerType==='pen')pencilActive=false;
  var ac_ctx=document.getElementById('annoCanvas').getContext('2d');

  if(currentTool==='arrow'&&arrowStart){
    var pos=getPosFromEvent(e.changedTouches
      ?{clientX:e.changedTouches[0].clientX,clientY:e.changedTouches[0].clientY}
      :e);
    drawArrowShape(arrowStart.x,arrowStart.y,pos.x,pos.y);
    if(currentStroke){currentStroke.type='arrow';currentStroke.end={x:pos.x,y:pos.y};strokes.push(currentStroke);}
    arrowStart=null;
  } else if(currentStroke&&currentTool!=='text'){
    strokes.push(currentStroke);
  }
  currentStroke=null;
  ac_ctx.globalAlpha=1;
  ac_ctx.globalCompositeOperation='source-over';
  saveCurrentPage();
}

// ══ ARROW SHAPE ══
function drawArrowShape(x1,y1,x2,y2){
  var ac_ctx=document.getElementById('annoCanvas').getContext('2d');
  var hl=Math.min(22,currentSize*5);
  var angle=Math.atan2(y2-y1,x2-x1);
  ac_ctx.save();
  ac_ctx.strokeStyle=currentColor;ac_ctx.fillStyle=currentColor;
  ac_ctx.lineWidth=currentSize;ac_ctx.lineCap='round';
  ac_ctx.beginPath();ac_ctx.moveTo(x1,y1);ac_ctx.lineTo(x2,y2);ac_ctx.stroke();
  ac_ctx.beginPath();
  ac_ctx.moveTo(x2,y2);
  ac_ctx.lineTo(x2-hl*Math.cos(angle-Math.PI/6),y2-hl*Math.sin(angle-Math.PI/6));
  ac_ctx.lineTo(x2-hl*Math.cos(angle+Math.PI/6),y2-hl*Math.sin(angle+Math.PI/6));
  ac_ctx.closePath();ac_ctx.fill();
  ac_ctx.restore();
}

// ══ TEXT TOOL ══
function placeText(e){
  var pos=getPosFromEvent(e);
  var area=document.getElementById('edCanvasArea');
  var wrap=document.getElementById('canvasWrap');
  var wRect=wrap.getBoundingClientRect();
  var aRect=area.getBoundingClientRect();
  var overlay=document.getElementById('textOverlay');
  overlay.style.left=(pos.x*scale+(wRect.left-aRect.left))+'px';
  overlay.style.top=(pos.y*scale+(wRect.top-aRect.top))+'px';
  overlay.style.fontSize=Math.max(14,currentSize*4)+'px';
  overlay.style.color=currentColor;
  overlay.style.display='block';overlay.value='';
  setTimeout(function(){overlay.focus();},50);
  overlay.onkeydown=function(ev){
    if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();commitText(pos.x,pos.y,overlay.value);overlay.style.display='none';}
    if(ev.key==='Escape'){overlay.style.display='none';}
  };
  overlay.onblur=function(){
    if(overlay.value.trim())commitText(pos.x,pos.y,overlay.value);
    overlay.style.display='none';
  };
}

function commitText(x,y,text){
  if(!text||!text.trim())return;
  pushUndo();
  var ac_ctx=document.getElementById('annoCanvas').getContext('2d');
  var fs=Math.max(14,currentSize*4);
  var ff=getComputedStyle(document.body).fontFamily||'sans-serif';
  ac_ctx.save();
  ac_ctx.font='600 '+fs+'px '+ff;
  ac_ctx.fillStyle=currentColor;
  ac_ctx.strokeStyle='rgba(0,0,0,.4)';
  ac_ctx.lineWidth=Math.max(1,fs*0.05);
  var lines=text.split('\n');
  lines.forEach(function(line,i){
    if(ac_ctx.lineWidth>0.5)ac_ctx.strokeText(line,x,y+i*fs*1.3);
    ac_ctx.fillText(line,x,y+i*fs*1.3);
  });
  ac_ctx.restore();
  // Save as stroke for potential future redo
  strokes.push({tool:'text',color:currentColor,size:currentSize,
    points:[{x:x,y:y}],text:text});
  saveCurrentPage();
}


// ══ STROKE ERASER ══
function removeNearStrokes(x,y){
  var THRESH=Math.max(20,currentSize*6)/scale;
  var before=strokes.length;
  strokes=strokes.filter(function(s){
    if(!s||!s.points||!s.points.length)return true;
    return !s.points.some(function(p){return Math.hypot(p.x-x,p.y-y)<THRESH;});
  });
  if(strokes.length!==before){redrawAllStrokes();saveCurrentPage();}
}

function redrawAllStrokes(){
  var ac=document.getElementById('annoCanvas');
  var ac_ctx=ac.getContext('2d');
  ac_ctx.clearRect(0,0,ac.width,ac.height);
  strokes.forEach(function(s){
    if(!s||!s.points||!s.points.length)return;
    ac_ctx.save();
    if(s.tool==='highlight'){ac_ctx.globalAlpha=0.35;ac_ctx.strokeStyle=s.color;ac_ctx.lineWidth=s.size*4;}
    else{ac_ctx.globalAlpha=1;ac_ctx.strokeStyle=s.color;ac_ctx.lineWidth=s.size;}
    ac_ctx.lineCap='round';ac_ctx.lineJoin='round';
    if(s.tool==='arrow'&&s.end){
      drawArrowShape(s.points[0].x,s.points[0].y,s.end.x,s.end.y);
    } else if(s.points.length>1){
      ac_ctx.beginPath();
      ac_ctx.moveTo(s.points[0].x,s.points[0].y);
      for(var i=1;i<s.points.length;i++){
        var mx=(s.points[i-1].x+s.points[i].x)/2;
        var my=(s.points[i-1].y+s.points[i].y)/2;
        ac_ctx.quadraticCurveTo(s.points[i-1].x,s.points[i-1].y,mx,my);
      }
      ac_ctx.lineTo(s.points[s.points.length-1].x,s.points[s.points.length-1].y);
      ac_ctx.stroke();
    } else {
      ac_ctx.beginPath();
      ac_ctx.arc(s.points[0].x,s.points[0].y,s.size/2,0,Math.PI*2);
      ac_ctx.fill();
    }
    ac_ctx.restore();
  });
}


function getPos(e){return getPosFromEvent(e);}// legacy alias
// ══ DRAW EVENTS ══
// Pointer Events API handles Mouse, Touch, AND Apple Pencil in one unified stream
// This is the correct API for iPad + Apple Pencil — gives pressure, tilt, and coalesced events
var ac_el=document.getElementById('annoCanvas');
ac_el.style.touchAction='none'; // must be set to prevent scroll interference

if(window.PointerEvent){
  // Modern path: Pointer Events (works on iPad with Pencil)
  ac_el.addEventListener('pointerdown',startDraw,{passive:false});
  ac_el.addEventListener('pointermove',moveDraw,{passive:false});
  ac_el.addEventListener('pointerup',endDraw,{passive:false});
  ac_el.addEventListener('pointercancel',function(e){pencilActive=false;if(isDrawing)endDraw(e);});
  ac_el.addEventListener('pointerleave',function(e){if(isDrawing)endDraw(e);});
  // Prevent browser from capturing pointer (critical for iPad)
  ac_el.addEventListener('pointerdown',function(e){
    if(e.pointerType==='pen'){
      ac_el.setPointerCapture(e.pointerId);
      // Prevent iOS selection UI while pencil is active
      document.body.style.webkitUserSelect='none';
      document.body.style.userSelect='none';
    }
  });
  ac_el.addEventListener('pointerup',function(e){
    if(e.pointerType==='pen'){
      document.body.style.webkitUserSelect='';
      document.body.style.userSelect='';
    }
  });
  // Prevent long-press context menu (copy/paste/find popup on iPad)
  ac_el.addEventListener('contextmenu',function(e){e.preventDefault();return false;});
  document.getElementById('edCanvasArea').addEventListener('contextmenu',function(e){e.preventDefault();return false;});
  // Block long-press selection menu on the entire editor screen
  document.getElementById('editorScreen').addEventListener('contextmenu',function(e){e.preventDefault();return false;});
  document.getElementById('editorScreen').addEventListener('touchstart',function(e){
    // If pencil is drawing, prevent any touch-based selection
    if(pencilActive)e.preventDefault();
  },{passive:false});
} else {
  // Fallback: Touch + Mouse events for older browsers
  ac_el.addEventListener('mousedown',startDraw);
  ac_el.addEventListener('mousemove',moveDraw);
  ac_el.addEventListener('mouseup',endDraw);
  ac_el.addEventListener('mouseleave',function(e){if(isDrawing)endDraw(e);});
  ac_el.addEventListener('touchstart',startDraw,{passive:false});
  ac_el.addEventListener('touchmove',moveDraw,{passive:false});
  ac_el.addEventListener('touchend',endDraw,{passive:false});
}

function loadImageFile(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var note=notes.find(function(n){return n.id===activeNoteId;});
      if(!note)return;
      saveCurrentPage();
      // Add as new page
      if(!note.pages)note.pages=[];
      note.pages.push({base:null,anno:null,strokes:[]});
      activePage=note.pages.length-1;
      var cv=getCanvases();
      cv.base.width=img.naturalWidth;cv.base.height=img.naturalHeight;
      cv.anno.width=img.naturalWidth;cv.anno.height=img.naturalHeight;
      cv.baseCtx.drawImage(img,0,0);cv.annoCtx.clearRect(0,0,img.naturalWidth,img.naturalHeight);
      fitToView(img.naturalWidth,img.naturalHeight);
      strokes=[];
      saveCurrentPage();renderPageStrip();pushUndo();
      showToast('Photo added as page '+activePage,'green');
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function loadPdfFile(file){
  if(!file)return;
  if(typeof pdfjsLib==='undefined'){showToast('PDF library not available');return;}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  showToast('Loading PDF pages...','blue');
  var reader=new FileReader();
  reader.onload=function(ev){
    var b64=ev.target.result.split(',')[1];
    var raw=atob(b64),arr=new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
    pdfjsLib.getDocument({data:arr}).promise.then(function(pdf){
      pdfDoc=pdf;pdfTotalPages=pdf.numPages;
      var note=notes.find(function(n){return n.id===activeNoteId;});
      if(!note)return;
      saveCurrentPage();
      // Add all PDF pages
      var startPage=note.pages?note.pages.length:0;
      var pagesAdded=0;
      function addPdfPage(pgNum){
        if(pgNum>pdf.numPages){
          showToast(pdf.numPages+' PDF pages added','green');
          activePage=startPage;renderPageStrip();loadPage(activePage);return;
        }
        pdf.getPage(pgNum).then(function(pg){
          var vp=pg.getViewport({scale:1.6});
          var tmp=document.createElement('canvas');tmp.width=vp.width;tmp.height=vp.height;
          pg.render({canvasContext:tmp.getContext('2d'),viewport:vp}).promise.then(function(){
            if(!note.pages)note.pages=[];
            note.pages.push({base:tmp.toDataURL('image/jpeg',0.85),anno:null,strokes:[]});
            pagesAdded++;
            addPdfPage(pgNum+1);
          });
        });
      }
      addPdfPage(1);
      saveNotes(notes);
    }).catch(function(e){showToast('PDF error: '+e.message.slice(0,50));});
  };
  reader.readAsDataURL(file);
}

// ══ EXPORT ══
function exportCurrentPage(){
  saveCurrentPage();
  var cv=getCanvases();
  var flat=document.createElement('canvas');flat.width=cv.base.width;flat.height=cv.base.height;
  var fc=flat.getContext('2d');fc.drawImage(cv.base,0,0);fc.drawImage(cv.anno,0,0);
  flat.toBlob(function(blob){
    var note=notes.find(function(n){return n.id===activeNoteId;});
    var name=(note?note.name:'FieldNote').replace(/[^a-z0-9]/gi,'-');
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download=name+'-p'+(activePage+1)+'.jpg';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},3000);
    showToast('Saved','green');
  },'image/jpeg',0.92);
}

function emailNote(noteId){
  var note=notes.find(function(n){return n.id===noteId;});
  if(!note||!note.pages||!note.pages[0]||!note.pages[0].base){
    showToast('Note has no content to email');return;
  }
  // Build a flat canvas and open mail with image as body (data: URI approach)
  // Since we can't attach files via mailto, we download + open email
  var cv=document.createElement('canvas');
  var pg=note.pages[0];
  var bImg=new Image();
  bImg.onload=function(){
    cv.width=bImg.naturalWidth;cv.height=bImg.naturalHeight;
    var ctx=cv.getContext('2d');ctx.drawImage(bImg,0,0);
    if(pg.anno){var ai=new Image();ai.onload=function(){ctx.drawImage(ai,0,0);sendEmail(cv,note);};ai.src=pg.anno;}
    else{sendEmail(cv,note);}
  };
  bImg.src=pg.base;
}
function sendEmail(canvas,note){
  var fname=(note.name||'FieldNote').replace(/[^a-z0-9]/gi,'-')+'.jpg';
  var url=canvas.toDataURL('image/jpeg',0.9);
  var a=document.createElement('a');a.href=url;a.download=fname;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){
    var subject='Field Note: '+encodeURIComponent(note.name||'Field Note');
    var body=encodeURIComponent('Field note attached: '+fname+'\n\nC&W Contracting Services');
    var to='wlusk%40cwcontracting.com';
    window.location.href='mailto:'+to+'?subject='+subject+'&body='+body;
    URL.revokeObjectURL(url);
  },500);
  showToast('Opening Mail with note...','green');
}

// ══ UPDATED renderGrid ══
function renderGrid(){
  var grid=document.getElementById('hmGrid');
  grid.innerHTML='';
  var q=searchQuery?searchQuery.toLowerCase().trim():'';
  var filtered=notes.filter(function(n){
    if(n.deleted)return false;
    if(q&&!(n.name||'').toLowerCase().includes(q))return false;
    // Job filter
    if(currentFolderId&&currentFolderId!=='__all__'){
      if(n.folderId!==currentFolderId)return false;
    }
    // Category filter
    if(currentFilter==='photo')return n.category==='photo';
    if(currentFilter==='plan')return n.category==='plan';
    if(currentFilter==='sketch')return n.category==='sketch';
    if(currentFilter==='issue')return !!n.flagged;
    return true;
  });

  if(!currentFolderId){
    grid.innerHTML='<div class="hm-no-job"><div class="hm-no-job-icon">🏗️</div><div class="hm-no-job-title">Select a job to view notes</div><div class="hm-no-job-sub">Or create a new job using the + button</div></div>';
    return;
  }

  if(!filtered.length){
    var emptyMsg=q?'No notes match "'+escHtml(q)+'"':currentFilter!=='all'?'No '+currentFilter+'s for this job yet':'No notes for this job yet';
    grid.innerHTML='<div class="hm-empty"><div class="hm-empty-icon">'+(currentFilter==='photo'?'📷':currentFilter==='plan'?'📐':currentFilter==='issue'?'🚩':'✏️')+'</div><div class="hm-empty-title">'+emptyMsg+'</div><div class="hm-empty-sub">Tap the orange + button to add one</div></div>';
    return;
  }

  filtered.sort(function(a,b){return (b.updatedAt||0)-(a.updatedAt||0);});

  // Date grouping
  var groups={};
  filtered.forEach(function(n){
    var d=new Date(n.updatedAt||n.createdAt||0);
    var now=new Date();
    var key;
    if(d.toDateString()===now.toDateString())key='Today';
    else{var y=new Date(now);y.setDate(y.getDate()-1);key=d.toDateString()===y.toDateString()?'Yesterday':d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});}
    if(!groups[key])groups[key]=[];
    groups[key].push(n);
  });

  Object.keys(groups).forEach(function(dateKey){
    var lbl=document.createElement('div');lbl.className='hm-section-date';lbl.textContent=dateKey;
    grid.appendChild(lbl);
    groups[dateKey].forEach(function(note){
      grid.appendChild(buildNoteCard(note));
    });
  });
}

function buildNoteCard(note){
  var card=document.createElement('div');
  card.className='note-card'+(note.flagged?' flagged':'');

  var typeLabel=note.category==='photo'?'Photo':note.category==='plan'?'Plan':'Sketch';
  var typeBadgeClass=note.category==='photo'?'badge-photo':note.category==='plan'?'badge-plan':'badge-sketch';
  var pageCount=(note.pages||[]).length;

  var thumbHtml=note.thumbnail
    ?'<img src="'+note.thumbnail+'" alt="">'
    :'<div class="note-card-thumb-empty"><svg width="32" height="32" fill="none" stroke="var(--tx4)" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>';

  card.innerHTML='<div class="note-card-thumb">'
    +thumbHtml
    +'<div class="note-card-type-badge '+typeBadgeClass+'">'+typeLabel+'</div>'
    +(note.flagged?'<div class="note-card-issue" title="Flagged issue"></div>':'')
    +(pageCount>1?'<div class="note-card-pages">'+pageCount+'p</div>':'')
    +'</div>'
    +'<div class="note-card-body">'
    +'<div class="note-card-name">'+escHtml(note.name||'Untitled')+'</div>'
    +'<div class="note-card-meta">'+formatDate(note.updatedAt||note.createdAt)+'</div>'
    +'</div>'
    +'<button class="note-card-menu" data-id="'+note.id+'" type="button">···</button>';

  card.addEventListener('click',function(){openEditor(note.id);});
  card.querySelector('.note-card-menu').addEventListener('click',function(e){
    e.stopPropagation();
    showCtxMenu(note.id,e.clientX,e.clientY);
  });
  return card;
}
