<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1c1e">
<title>Field Notes — C&W</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#1c1c1e;--sb:#2c2c2e;--s1:#2c2c2e;--s2:#3a3a3c;--s3:#48484a;
  --b1:#3a3a3c;--b2:#48484a;
  --accent:#E8622A;--accent-dim:rgba(232,98,42,.15);
  --green:#34c759;--blue:#0a84ff;--purple:#bf5af2;--red:#ff453a;--yellow:#ffd60a;
  --tx1:#f2f2f7;--tx2:#aeaeb2;--tx3:#636366;--tx4:#3a3a3c;
  --mono:'DM Mono',monospace;--disp:'Syne',sans-serif;--body:'DM Sans',sans-serif;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
  --sidebar-w:220px;--tool-h:56px;--strip-h:88px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--tx1);font-family:var(--body);-webkit-font-smoothing:antialiased}

/* ════ HOME SCREEN ════ */
#homeScreen{position:fixed;inset:0;display:flex;background:var(--bg);z-index:100}
#homeScreen.hidden{display:none}

/* Home sidebar */
.hm-sidebar{width:var(--sidebar-w);background:var(--sb);border-right:1px solid var(--b1);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.hm-sb-top{padding:calc(var(--safe-top) + 16px) 14px 10px;border-bottom:1px solid var(--b1)}
.hm-app-hdr{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.hm-app-icon{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hm-app-name{font-family:var(--disp);font-size:16px;font-weight:700;color:var(--tx1)}
.hm-app-sub{font-family:var(--mono);font-size:9px;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase}
.hm-nav{flex:1;overflow-y:auto;padding:8px 8px}
.hm-nav-lbl{font-family:var(--mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);padding:6px 8px 4px}
.hm-nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--tx2);font-size:13px;font-weight:500;transition:all .12s;margin-bottom:1px;border:1px solid transparent}
.hm-nav-item:hover{background:var(--s2);color:var(--tx1)}
.hm-nav-item.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(232,98,42,.18)}
.hm-nav-ct{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--tx3);background:var(--s3);border-radius:8px;padding:1px 7px}
.hm-folder-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.hm-sb-foot{padding:10px 12px;border-top:1px solid var(--b1);display:flex;flex-direction:column;gap:6px}
.hm-back-link{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx3);text-decoration:none;padding:6px 8px;border-radius:8px;transition:all .12s}
.hm-back-link:hover{color:var(--tx1);background:var(--s2)}

/* Home main */
.hm-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.hm-toolbar{height:52px;padding:0 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--b1);background:var(--sb);flex-shrink:0;padding-top:var(--safe-top)}
.hm-title{font-family:var(--disp);font-size:18px;font-weight:700;flex:1}
.hm-btn{height:34px;padding:0 14px;border-radius:9px;border:none;cursor:pointer;font-family:var(--body);font-size:13px;font-weight:500;transition:all .15s;display:flex;align-items:center;gap:6px}
.hm-btn.primary{background:var(--accent);color:#fff}
.hm-btn.primary:hover{opacity:.9}
.hm-btn.secondary{background:var(--s2);color:var(--tx2);border:1px solid var(--b1)}
.hm-btn.secondary:hover{color:var(--tx1);background:var(--s3)}
.hm-btn.icon{width:34px;padding:0;justify-content:center;background:var(--s2);color:var(--tx2);border:1px solid var(--b1)}
.hm-btn.icon:hover{color:var(--tx1);background:var(--s3)}
.hm-grid{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;align-content:start}
.hm-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--tx3);text-align:center;padding:40px}
.hm-empty-icon{font-size:40px;opacity:.5}
.hm-empty-title{font-size:15px;font-weight:600;color:var(--tx2)}
.hm-empty-sub{font-size:13px;line-height:1.5}

/* Note card */
.note-card{background:var(--s1);border:1px solid var(--b1);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .15s;position:relative}
.note-card:hover{border-color:var(--b2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.note-card-thumb{width:100%;aspect-ratio:4/3;background:#2a2a2e;overflow:hidden;position:relative}
.note-card-thumb canvas,.note-card-thumb img{width:100%;height:100%;object-fit:cover}
.note-card-thumb-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;opacity:.3}
.note-card-body{padding:10px 11px 11px}
.note-card-name{font-size:13px;font-weight:600;color:var(--tx1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.note-card-meta{font-family:var(--mono);font-size:10px;color:var(--tx3)}
.note-card-pages{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);border-radius:6px;padding:2px 7px;font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.7)}
.note-card-menu{position:absolute;top:7px;left:7px;width:26px;height:26px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s}
.note-card:hover .note-card-menu{opacity:1}

/* Context menu */
.ctx-menu{position:fixed;background:#2c2c2e;border:1px solid var(--b2);border-radius:13px;padding:6px;z-index:9999;box-shadow:0 12px 40px rgba(0,0,0,.7);min-width:170px;display:none}
.ctx-menu.show{display:block}
.ctx-item{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--tx1);display:flex;align-items:center;gap:8px;transition:background .1s}
.ctx-item:hover{background:var(--s3)}
.ctx-item.danger{color:var(--red)}
.ctx-item.danger:hover{background:rgba(255,69,58,.12)}

/* ════ EDITOR ════ */
#editorScreen{position:fixed;inset:0;display:flex;flex-direction:column;background:#0a0a0a;z-index:200}
#editorScreen.hidden{display:none}
.ed-topbar{height:calc(44px + var(--safe-top));padding-top:var(--safe-top);background:rgba(28,28,30,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;padding-left:12px;padding-right:12px;flex-shrink:0;z-index:10}
.ed-back{display:flex;align-items:center;gap:4px;color:var(--blue);font-size:15px;cursor:pointer;padding:4px 6px;border-radius:8px;transition:background .12s;border:none;background:none}
.ed-back:hover{background:rgba(10,132,255,.15)}
.ed-title-wrap{flex:1;text-align:center}
.ed-title{font-size:15px;font-weight:600;color:var(--tx1);cursor:pointer}
.ed-title:hover{opacity:.7}
.ed-topbar-actions{display:flex;gap:6px}
.ed-action{width:34px;height:34px;border-radius:9px;border:none;background:transparent;color:var(--tx2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.ed-action:hover{background:rgba(255,255,255,.1);color:var(--tx1)}

/* Canvas */
.ed-canvas-area{flex:1;position:relative;overflow:hidden;background:#1a1a1a;touch-action:none}
.canvas-wrap{position:absolute;transform-origin:0 0;will-change:transform}
#baseCanvas{display:block}
#annoCanvas{position:absolute;top:0;left:0;touch-action:none}

/* Page strip */
.ed-page-strip{height:var(--strip-h);background:rgba(28,28,30,.95);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:8px;padding:0 12px;overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.ed-page-strip::-webkit-scrollbar{display:none}
.page-thumb{width:60px;height:72px;border-radius:8px;overflow:hidden;border:2px solid transparent;cursor:pointer;flex-shrink:0;background:#2c2c2e;position:relative;transition:all .15s}
.page-thumb.active{border-color:var(--blue)}
.page-thumb canvas,.page-thumb img{width:100%;height:100%;object-fit:cover}
.page-thumb-num{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:8px;color:rgba(255,255,255,.5)}
.page-thumb-add{width:60px;height:72px;border-radius:8px;border:2px dashed rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--tx3);transition:all .15s}
.page-thumb-add:hover{border-color:var(--blue);color:var(--blue)}

/* Toolbar */
.ed-toolbar{height:var(--tool-h);background:rgba(28,28,30,.95);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:3px;padding:0 10px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;padding-bottom:var(--safe-bot)}
.ed-toolbar::-webkit-scrollbar{display:none}
.tool-btn{width:38px;height:38px;border-radius:10px;border:none;background:transparent;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0;position:relative}
.tool-btn:hover{background:rgba(255,255,255,.08);color:var(--tx1)}
.tool-btn.active{background:var(--accent-dim);color:var(--accent)}
.tool-sep{width:1px;height:24px;background:rgba(255,255,255,.08);flex-shrink:0;margin:0 3px}
.color-swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;flex-shrink:0;border:2px solid transparent;transition:transform .12s}
.color-swatch.active{border-color:rgba(255,255,255,.8);transform:scale(1.2)}
.size-chip{font-family:var(--mono);font-size:10px;padding:4px 9px;border-radius:7px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--tx3);cursor:pointer;flex-shrink:0;transition:all .12s}
.size-chip.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(232,98,42,.35)}

/* Eraser mode popup */
.eraser-popup{position:fixed;bottom:calc(var(--tool-h) + var(--strip-h) + 8px);left:50%;transform:translateX(-50%);background:#2c2c2e;border:1px solid var(--b2);border-radius:13px;padding:8px;display:none;gap:6px;z-index:500;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.eraser-popup.show{display:flex}
.eraser-opt{padding:9px 16px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--tx1);text-align:center;transition:background .12s;border:none;background:transparent;display:flex;align-items:center;gap:7px}
.eraser-opt.active{background:var(--accent-dim);color:var(--accent)}
.eraser-opt:hover{background:var(--s3)}

/* Text overlay */
.text-overlay{position:absolute;background:transparent;border:1.5px dashed rgba(255,255,255,.4);border-radius:4px;padding:4px 6px;font-family:var(--body);font-size:16px;color:#fff;outline:none;resize:none;min-width:100px;min-height:28px;z-index:20;display:none;line-height:1.4}

/* Toast */
.toast{position:fixed;bottom:calc(var(--tool-h) + var(--strip-h) + 12px);left:50%;transform:translateX(-50%) translateY(12px);background:#2c2c2e;border:1px solid var(--b2);border-radius:12px;padding:10px 18px;font-size:12px;font-family:var(--mono);color:var(--tx1);opacity:0;transition:all .25s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.green{border-color:var(--green);color:var(--green)}
.toast.blue{border-color:var(--blue);color:var(--blue)}

/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:5000;display:none;align-items:flex-end;justify-content:center}
.modal-back.show{display:flex}
.modal{background:#2c2c2e;border-radius:20px 20px 0 0;padding:22px 18px calc(22px + var(--safe-bot));width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px}
.modal-title{font-family:var(--disp);font-size:18px;font-weight:700}
.modal-input{background:#1c1c1e;border:1px solid var(--b2);border-radius:11px;color:var(--tx1);font-family:var(--body);font-size:15px;padding:12px 14px;outline:none;width:100%}
.modal-input:focus{border-color:var(--blue)}
.modal-btns{display:flex;gap:8px}
.modal-btn{flex:1;padding:13px;border-radius:12px;border:none;font-family:var(--body);font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
.modal-btn.primary{background:var(--blue);color:#fff}
.modal-btn.cancel{background:var(--s3);color:var(--tx2)}
.modal-btn:hover{opacity:.85}

/* Mobile home - no sidebar split */
@media(max-width:767px){
  .hm-sidebar{display:none}
  #mobileHomeBar{display:flex}
}
@media(min-width:768px){
  #mobileHomeBar{display:none!important}
  .hm-sidebar{display:flex}
}
#mobileHomeBar{height:calc(44px + var(--safe-top));padding-top:var(--safe-top);background:var(--sb);border-bottom:1px solid var(--b1);align-items:center;padding:var(--safe-top) 14px 0;gap:10px;flex-shrink:0;display:none}
.mob-seg{display:flex;background:var(--s3);border-radius:9px;padding:2px;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.mob-seg-item{padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--tx2);transition:all .12s}
.mob-seg-item.active{background:var(--bg);color:var(--tx1)}

/* CW Sidebar for desktop */
.cw-sidebar{display:none;width:210px;background:#141414;border-right:1px solid #252525;flex-direction:column;position:fixed;top:0;left:0;height:100%;z-index:20}
@media(min-width:768px){.cw-sidebar{display:flex}}
.cw-sb-hdr{padding:20px 16px 14px;border-bottom:1px solid #252525;display:flex;align-items:center;gap:10px}
.cw-pill{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cw-brand{font-family:var(--disp);font-size:14px;font-weight:700}
.cw-brand-sub{font-family:var(--mono);font-size:9px;color:#555250;text-transform:uppercase;letter-spacing:.08em}
.cw-nav{padding:10px 8px;flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.cw-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;text-decoration:none;color:#8a8780;font-size:13px;font-weight:500;transition:all .15s;border:1px solid transparent}
.cw-item:hover{background:#1a1a1a;color:#f0ede8}
.cw-item.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(232,98,42,.15)}
.cw-icon{width:15px;height:15px;flex-shrink:0}
.cw-foot{padding:12px 16px;border-top:1px solid #252525}
.cw-date{font-family:var(--mono);font-size:10px;color:#555250}
@media(min-width:768px){
  #homeScreen,#editorScreen{left:210px}
}
</style>
</head>

        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Back to PM Tools
      </a>

  <!-- Main grid -->
  <div class="hm-main">
    <div class="hm-toolbar">

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

// ══ STORAGE ══
function getFolders(){try{return JSON.parse(localStorage.getItem('fn-folders')||'[]');}catch(e){return[];}}
function saveFolders(f){try{localStorage.setItem('fn-folders',JSON.stringify(f));}catch(e){}}
function getNotes(){try{return JSON.parse(localStorage.getItem('fn-notes')||'[]');}catch(e){return[];}}
function saveNotes(n){try{localStorage.setItem('fn-notes',JSON.stringify(n));}catch(e){showToast('Storage full — export notes to free space');}}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

// ══ TOAST ══
var _tt;
function showToast(msg,style){
  var t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show'+(style?' '+style:'');
  clearTimeout(_tt);_tt=setTimeout(function(){t.className='toast';},3000);
}

// ══ STATE ══
var folders=getFolders();
var notes=getNotes();
var currentFolderId='__all__'; // __all__ = all notes, __unfiled__ = no folder
var activeNoteId=null;
var activePage=0; // 0-indexed
var currentTool='pen';
var currentColor='#ff453a';
var currentSize=4;
var scale=1,panX=0,panY=0;
var isDrawing=false,lastX=0,lastY=0;
var undoStack=[],redoStack=[];
var strokes=[]; // for stroke eraser — each stroke is {points, color, size, tool}
var currentStroke=null;
var pdfDoc=null,pdfTotalPages=1;
var eraserMode='pixel'; // pixel or stroke
var arrowStart=null;
var ctxTargetId=null; // note id for context menu

// ══ MODAL ══
var _modalResolve=null;
function showModal(title,placeholder,initialVal){
  return new Promise(function(resolve){
    _modalResolve=resolve;
    document.getElementById('modalTitle').textContent=title;
    var inp=document.getElementById('modalInput');
    inp.placeholder=placeholder||'';
    inp.value=initialVal||'';
    document.getElementById('modalBack').classList.add('show');
    setTimeout(function(){inp.focus();inp.select();},200);
  });
}
document.getElementById('modalCancel').addEventListener('click',function(){
  document.getElementById('modalBack').classList.remove('show');
  if(_modalResolve){_modalResolve(null);_modalResolve=null;}
});
document.getElementById('modalOk').addEventListener('click',function(){
  var v=document.getElementById('modalInput').value.trim();
  document.getElementById('modalBack').classList.remove('show');
  if(_modalResolve){_modalResolve(v||null);_modalResolve=null;}
});
document.getElementById('modalInput').addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();document.getElementById('modalOk').click();}
  if(e.key==='Escape'){document.getElementById('modalCancel').click();}
});

// ══ HOME: RENDER NAV ══
var FOLDER_COLORS=['#ff453a','#0a84ff','#34c759','#ffd60a','#bf5af2','#E8622A','#5ac8fa','#ff9f0a'];
function renderNav(){
  var nav=document.getElementById('hmNav');
  var seg=document.getElementById('mobSeg');
  nav.innerHTML='';seg.innerHTML='';
  var allCt=notes.filter(function(n){return !n.deleted;}).length;
  var unfiledCt=notes.filter(function(n){return !n.deleted&&!n.folderId;}).length;
  function navItem(id,label,ct,colorDot){
    var el=document.createElement('div');
    el.className='hm-nav-item'+(id===currentFolderId?' active':'');
    el.innerHTML=(colorDot?'<div class="hm-folder-dot" style="background:'+colorDot+'"></div>':'<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">'+(id==='__all__'?'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>':'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>')+'</svg>')
      +'<span style="flex:1">'+escHtml(label)+'</span><span class="hm-nav-ct">'+ct+'</span>';
    el.addEventListener('click',function(){currentFolderId=id;renderNav();renderGrid();});
    nav.appendChild(el);
    var si=document.createElement('div');
    si.className='mob-seg-item'+(id===currentFolderId?' active':'');
    si.textContent=label;
    si.addEventListener('click',function(){currentFolderId=id;renderNav();renderGrid();});
    seg.appendChild(si);
  }
  navItem('__all__','All Notes',allCt,null);
  navItem('__unfiled__','Unfiled',unfiledCt,null);
  nav.appendChild(Object.assign(document.createElement('div'),{className:'hm-nav-lbl',textContent:'Folders'}));
  folders.forEach(function(f){
    var fct=notes.filter(function(n){return !n.deleted&&n.folderId===f.id;}).length;
    var row=document.createElement('div');
    row.className='hm-nav-item'+(f.id===currentFolderId?' active':'');
    row.innerHTML='<div class="hm-folder-dot" style="background:'+f.color+'"></div>'
      +'<span style="flex:1">'+escHtml(f.name)+'</span>'
      +'<span class="hm-nav-ct">'+fct+'</span>';
    row.addEventListener('click',function(){currentFolderId=f.id;renderNav();renderGrid();});
    nav.appendChild(row);
    var si=document.createElement('div');
    si.className='mob-seg-item'+(f.id===currentFolderId?' active':'');
    si.textContent=f.name;
    si.addEventListener('click',function(){currentFolderId=f.id;renderNav();renderGrid();});
    seg.appendChild(si);
  });
  // Update view title
  var t='All Notes';
  if(currentFolderId==='__unfiled__')t='Unfiled';
  else{var f=folders.find(function(x){return x.id===currentFolderId;});if(f)t=f.name;}
  document.getElementById('hmViewTitle').textContent=t;
}

// ══ HOME: RENDER GRID ══
function renderGrid(){
  var grid=document.getElementById('hmGrid');
  grid.innerHTML='';
  var visible=notes.filter(function(n){
    if(n.deleted)return false;
    if(currentFolderId==='__all__')return true;
    if(currentFolderId==='__unfiled__')return !n.folderId;
    return n.folderId===currentFolderId;
  });
  if(!visible.length){
    grid.innerHTML='<div class="hm-empty" style="grid-column:1/-1"><div class="hm-empty-icon">✏️</div><div class="hm-empty-title">No notes here</div><div class="hm-empty-sub">Tap New Note to start</div></div>';
    return;
  }
  visible.sort(function(a,b){return (b.updatedAt||0)-(a.updatedAt||0);});
  visible.forEach(function(note){
    var card=document.createElement('div');
    card.className='note-card';
    var pageCount=(note.pages||[]).length||1;
    var thumb='';
    if(note.thumbnail){
      thumb='<img src="'+note.thumbnail+'" style="width:100%;height:100%;object-fit:cover">';
    } else {
      thumb='<div class="note-card-thumb-empty">✏️</div>';
    }
    card.innerHTML='<div class="note-card-thumb">'+thumb+'</div>'
      +'<div class="note-card-body">'
      +'<div class="note-card-name">'+escHtml(note.name||'Untitled')+'</div>'
      +'<div class="note-card-meta">'+formatDate(note.updatedAt||note.createdAt)+(pageCount>1?' · '+pageCount+' pages':'')+'</div>'
      +'</div>'
      +(pageCount>1?'<div class="note-card-pages">'+pageCount+'p</div>':'')
      +'<div class="note-card-menu" data-id="'+note.id+'">···</div>';
    card.addEventListener('click',function(){openEditor(note.id);});
    card.querySelector('.note-card-menu').addEventListener('click',function(e){
      e.stopPropagation();showCtxMenu(note.id,e.clientX,e.clientY);
    });
    grid.appendChild(card);
  });
}

// ══ CONTEXT MENU ══
function showCtxMenu(noteId,x,y){
  ctxTargetId=noteId;
  var m=document.getElementById('ctxMenu');
  m.style.left=Math.min(x,window.innerWidth-190)+'px';
  m.style.top=Math.min(y,window.innerHeight-160)+'px';
  m.classList.add('show');
}
function hideCtxMenu(){document.getElementById('ctxMenu').classList.remove('show');ctxTargetId=null;}
document.addEventListener('click',hideCtxMenu);
document.getElementById('ctxRename').addEventListener('click',async function(){
  hideCtxMenu();
  if(!ctxTargetId)return;
  var note=notes.find(function(n){return n.id===ctxTargetId;});
  var name=await showModal('Rename note','Note name',note?note.name:'');
  if(name&&note){note.name=name;note.updatedAt=Date.now();saveNotes(notes);renderGrid();}
});
document.getElementById('ctxMove').addEventListener('click',async function(){
  hideCtxMenu();
  if(!ctxTargetId)return;
  var opts='Enter folder name (or leave blank for Unfiled):\n'+folders.map(function(f){return f.name;}).join(', ');
  var name=await showModal('Move to Folder','Folder name or blank for Unfiled');
  if(name===null)return;
  var note=notes.find(function(n){return n.id===ctxTargetId;});
  if(!note)return;
  if(!name.trim()){note.folderId=null;}
  else{
    var f=folders.find(function(x){return x.name.toLowerCase()===name.trim().toLowerCase();});
    if(!f){f={id:genId(),name:name.trim(),color:FOLDER_COLORS[folders.length%FOLDER_COLORS.length],createdAt:Date.now()};folders.push(f);saveFolders(folders);}
    note.folderId=f.id;
  }
  note.updatedAt=Date.now();saveNotes(notes);renderNav();renderGrid();
});
document.getElementById('ctxEmail').addEventListener('click',function(){
  hideCtxMenu();
  if(!ctxTargetId)return;
  emailNote(ctxTargetId);
});
document.getElementById('ctxDelete').addEventListener('click',function(){
  hideCtxMenu();
  if(!ctxTargetId)return;
  if(!confirm('Delete this note?'))return;
  var note=notes.find(function(n){return n.id===ctxTargetId;});
  if(note){note.deleted=true;note.updatedAt=Date.now();saveNotes(notes);renderGrid();renderNav();}
});

// ══ FOLDERS ══
document.getElementById('newFolderBtn').addEventListener('click',async function(){
  var name=await showModal('New Folder','e.g. WMG Riverstone');
  if(!name)return;
  var f={id:genId(),name:name,color:FOLDER_COLORS[folders.length%FOLDER_COLORS.length],createdAt:Date.now()};
  folders.push(f);saveFolders(folders);
  currentFolderId=f.id;renderNav();renderGrid();
});

// ══ NEW NOTE ══
async function createNote(folderId){
  var name=await showModal('Note name','e.g. Site visit 5/8 or Sheet A2.1','Note '+(notes.filter(function(n){return !n.deleted;}).length+1));
  if(!name)return null;
  var note={
    id:genId(),name:name,
    folderId:folderId||null,
    pages:[{base:null,anno:null,strokes:[]}],
    thumbnail:null,
    createdAt:Date.now(),updatedAt:Date.now()
  };
  notes.unshift(note);saveNotes(notes);
  renderNav();renderGrid();
  return note;
}
document.getElementById('newNoteHomeBtn').addEventListener('click',async function(){
  var fid=(currentFolderId==='__all__'||currentFolderId==='__unfiled__')?null:currentFolderId;
  var note=await createNote(fid);
  if(note)openEditor(note.id);
});
document.getElementById('newNoteGridBtn').addEventListener('click',async function(){
  var fid=(currentFolderId==='__all__'||currentFolderId==='__unfiled__')?null:currentFolderId;
  var note=await createNote(fid);
  if(note)openEditor(note.id);
});

// ══ OPEN EDITOR ══
function openEditor(noteId){
  activeNoteId=noteId;activePage=0;
  undoStack=[];redoStack=[];pdfDoc=null;
  var note=notes.find(function(n){return n.id===noteId;});
  if(!note)return;
  document.getElementById('edTitle').textContent=note.name||'Untitled';
  document.getElementById('homeScreen').classList.add('hidden');
  document.getElementById('editorScreen').classList.remove('hidden');
  renderPageStrip();
  loadPage(activePage);
}

// ══ CLOSE EDITOR ══
document.getElementById('edBack').addEventListener('click',function(){
  saveCurrentPage();
  updateThumbnail();
  document.getElementById('editorScreen').classList.add('hidden');
  document.getElementById('homeScreen').classList.remove('hidden');
  renderGrid();renderNav();
});

// ══ PAGE STRIP ══
function renderPageStrip(){
  var note=notes.find(function(n){return n.id===activeNoteId;});
  if(!note)return;
  var strip=document.getElementById('pageStrip');
  strip.innerHTML='';
  (note.pages||[]).forEach(function(pg,i){
    var th=document.createElement('div');
    th.className='page-thumb'+(i===activePage?' active':'');
    if(pg.base){
      var img=document.createElement('img');img.src=pg.base;th.appendChild(img);
    } else {
      th.style.background='#fff';
    }
    var num=document.createElement('div');num.className='page-thumb-num';num.textContent=i+1;
    th.appendChild(num);
    th.addEventListener('click',function(){
      if(i===activePage)return;
      saveCurrentPage();activePage=i;renderPageStrip();loadPage(activePage);
    });
    strip.appendChild(th);
  });
  // Add page button
  var add=document.createElement('div');add.className='page-thumb-add';
  add.innerHTML='<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
  add.addEventListener('click',addBlankPage);
  strip.appendChild(add);
}

function addBlankPage(){
  var note=notes.find(function(n){return n.id===activeNoteId;});
  if(!note)return;
  if(!note.pages)note.pages=[];
  note.pages.push({base:null,anno:null,strokes:[]});
  saveNotes(notes);
  saveCurrentPage();
  activePage=note.pages.length-1;
  renderPageStrip();
  loadPage(activePage);
  showToast('Page '+(activePage+1)+' added','green');
}

document.getElementById('edAddPage').addEventListener('click',addBlankPage);

// ══ LOAD PAGE ══
function getCanvases(){
  return{base:document.getElementById('baseCanvas'),anno:document.getElementById('annoCanvas'),
    baseCtx:document.getElementById('baseCanvas').getContext('2d'),
    annoCtx:document.getElementById('annoCanvas').getContext('2d')};
}

function loadPage(pageIdx){
  var note=notes.find(function(n){return n.id===activeNoteId;});
  if(!note||!note.pages)return;
  var pg=note.pages[pageIdx];
  var cv=getCanvases();
  strokes=(pg&&pg.strokes)?pg.strokes.map(function(s){return JSON.parse(JSON.stringify(s));}):[];
  if(pg&&pg.base){
    var bImg=new Image();
    bImg.onload=function(){
      cv.base.width=bImg.naturalWidth;cv.base.height=bImg.naturalHeight;
      cv.anno.width=bImg.naturalWidth;cv.anno.height=bImg.naturalHeight;
      cv.baseCtx.drawImage(bImg,0,0);
      cv.annoCtx.clearRect(0,0,cv.anno.width,cv.anno.height);
      if(pg.anno){var ai=new Image();ai.onload=function(){cv.annoCtx.drawImage(ai,0,0);};ai.src=pg.anno;}
      document.getElementById('canvasWrap').style.display='block';
      fitToView(bImg.naturalWidth,bImg.naturalHeight);
      pushUndo();
    };
    bImg.src=pg.base;
  } else {
    // Blank page
    var W=1024,H=768;
    cv.base.width=W;cv.base.height=H;cv.anno.width=W;cv.anno.height=H;
    cv.baseCtx.fillStyle='#ffffff';cv.baseCtx.fillRect(0,0,W,H);
    cv.annoCtx.clearRect(0,0,W,H);
    document.getElementById('canvasWrap').style.display='block';
    fitToView(W,H);
    pushUndo();
  }
  renderPageStrip();
}

function fitToView(w,h){
  var area=document.getElementById('edCanvasArea');
  var aw=area.clientWidth-32,ah=area.clientHeight-32;
  scale=Math.min(aw/w,ah/h,2);
  panX=(area.clientWidth-w*scale)/2;
  panY=(area.clientHeight-h*scale)/2;
  applyTransform();
}
function applyTransform(){
  document.getElementById('canvasWrap').style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')';
}

// ══ SAVE PAGE ══
function saveCurrentPage(){
  var note=notes.find(function(n){return n.id===activeNoteId;});
  if(!note||!note.pages)return;
  var cv=getCanvases();
  if(!note.pages[activePage])note.pages[activePage]={base:null,anno:null,strokes:[]};
  note.pages[activePage].base=cv.base.toDataURL('image/jpeg',0.82);
  note.pages[activePage].anno=cv.anno.toDataURL('image/png');
  note.pages[activePage].strokes=strokes.map(function(s){return JSON.parse(JSON.stringify(s));});
  note.updatedAt=Date.now();
  saveNotes(notes);
}

function updateThumbnail(){
  var note=notes.find(function(n){return n.id===activeNoteId;});
  if(!note||!note.pages||!note.pages[0])return;
  var cv=getCanvases();
  var flat=document.createElement('canvas');flat.width=cv.base.width;flat.height=cv.base.height;
  var fc=flat.getContext('2d');fc.drawImage(cv.base,0,0);fc.drawImage(cv.anno,0,0);
  note.thumbnail=flat.toDataURL('image/jpeg',0.5);
  saveNotes(notes);
}

// ══ UNDO / REDO ══
function pushUndo(){
  var ac=document.getElementById('annoCanvas');
  undoStack.push(ac.toDataURL('image/png'));
  if(undoStack.length>50)undoStack.shift();
  redoStack=[];
}
function undo(){
  if(undoStack.length<2)return;
  var ac=document.getElementById('annoCanvas');
  var ac_ctx=ac.getContext('2d');
  redoStack.push(undoStack.pop());
  var img=new Image();
  img.onload=function(){ac_ctx.clearRect(0,0,ac.width,ac.height);ac_ctx.drawImage(img,0,0);saveCurrentPage();};
  img.src=undoStack[undoStack.length-1];
}
function redo(){
  if(!redoStack.length)return;
  var ac=document.getElementById('annoCanvas');
  var ac_ctx=ac.getContext('2d');
  var src=redoStack.pop();undoStack.push(src);
  var img=new Image();
  img.onload=function(){ac_ctx.clearRect(0,0,ac.width,ac.height);ac_ctx.drawImage(img,0,0);saveCurrentPage();};
  img.src=src;
}

// ══ DRAWING ══
function getPos(e){
  var ac=document.getElementById('annoCanvas');
  var rect=ac.getBoundingClientRect();
  var cx=e.touches?e.touches[0].clientX:e.clientX;
  var cy=e.touches?e.touches[0].clientY:e.clientY;
  return{x:(cx-rect.left)/scale,y:(cy-rect.top)/scale};
}

function startDraw(e){
  if(e.target.id!=='annoCanvas')return;
  if(currentTool==='text'){placeText(e);return;}
  if(e.touches&&e.touches.length>1)return; // pinch
  e.preventDefault();
  isDrawing=true;
  var pos=getPos(e);
  lastX=pos.x;lastY=pos.y;
  var ac_ctx=document.getElementById('annoCanvas').getContext('2d');
  if(currentTool==='eraser'){
    if(eraserMode==='stroke'){
      // Stroke eraser: find and remove strokes near touch point
      removeNearStrokes(pos.x,pos.y);
      return;
    }
    ac_ctx.globalCompositeOperation='destination-out';
    ac_ctx.lineWidth=currentSize*5;
  } else {
    pushUndo();
    currentStroke={tool:currentTool,color:currentColor,size:currentSize,points:[{x:pos.x,y:pos.y}]};
    if(currentTool==='arrow'){arrowStart={x:pos.x,y:pos.y};return;}
    if(currentTool==='highlight'){ac_ctx.globalAlpha=0.35;ac_ctx.strokeStyle=currentColor;ac_ctx.lineWidth=currentSize*4;}
    else{ac_ctx.globalAlpha=1;ac_ctx.strokeStyle=currentColor;ac_ctx.lineWidth=currentSize;}
    ac_ctx.lineCap='round';ac_ctx.lineJoin='round';
    ac_ctx.beginPath();ac_ctx.moveTo(pos.x,pos.y);
  }
}
function moveDraw(e){
  if(!isDrawing)return;
  if(e.touches&&e.touches.length>1)return;
  e.preventDefault();
  var pos=getPos(e);
  var ac=document.getElementById('annoCanvas');
  var ac_ctx=ac.getContext('2d');
  if(currentTool==='eraser'){
    if(eraserMode==='stroke'){removeNearStrokes(pos.x,pos.y);return;}
    ac_ctx.lineTo(pos.x,pos.y);ac_ctx.stroke();
    lastX=pos.x;lastY=pos.y;return;
  }
  if(currentTool==='arrow'){
    // Preview
    if(undoStack.length){
      var img=new Image();
      img.onload=function(){ac_ctx.clearRect(0,0,ac.width,ac.height);ac_ctx.drawImage(img,0,0);drawArrowShape(arrowStart.x,arrowStart.y,pos.x,pos.y);};
      img.src=undoStack[undoStack.length-1];
    }
    return;
  }
  if(currentStroke)currentStroke.points.push({x:pos.x,y:pos.y});
  ac_ctx.lineTo(pos.x,pos.y);ac_ctx.stroke();
  lastX=pos.x;lastY=pos.y;
}
function endDraw(e){
  if(!isDrawing)return;
  isDrawing=false;
  var ac_ctx=document.getElementById('annoCanvas').getContext('2d');
  if(currentTool==='eraser'){
    ac_ctx.globalCompositeOperation='source-over';
    saveCurrentPage();return;
  }
  if(currentTool==='arrow'&&arrowStart){
    var pos;
    if(e.changedTouches){pos={x:(e.changedTouches[0].clientX-document.getElementById('annoCanvas').getBoundingClientRect().left)/scale,y:(e.changedTouches[0].clientY-document.getElementById('annoCanvas').getBoundingClientRect().top)/scale};}
    else{pos=getPos(e);}
    drawArrowShape(arrowStart.x,arrowStart.y,pos.x,pos.y);
    if(currentStroke){currentStroke.type='arrow';currentStroke.end={x:pos.x,y:pos.y};strokes.push(currentStroke);}
    arrowStart=null;
  } else if(currentStroke&&currentTool!=='text'){
    strokes.push(currentStroke);
  }
  currentStroke=null;
  ac_ctx.globalAlpha=1;
  saveCurrentPage();
}

function drawArrowShape(x1,y1,x2,y2){
  var ac_ctx=document.getElementById('annoCanvas').getContext('2d');
  var hl=Math.min(22,currentSize*5);
  var angle=Math.atan2(y2-y1,x2-x1);
  ac_ctx.save();
  ac_ctx.strokeStyle=currentColor;ac_ctx.fillStyle=currentColor;
  ac_ctx.lineWidth=currentSize;ac_ctx.lineCap='round';
  ac_ctx.beginPath();ac_ctx.moveTo(x1,y1);ac_ctx.lineTo(x2,y2);ac_ctx.stroke();
  ac_ctx.beginPath();
  ac_ctx.moveTo(x2,y2);
  ac_ctx.lineTo(x2-hl*Math.cos(angle-Math.PI/6),y2-hl*Math.sin(angle-Math.PI/6));
  ac_ctx.lineTo(x2-hl*Math.cos(angle+Math.PI/6),y2-hl*Math.sin(angle+Math.PI/6));
  ac_ctx.closePath();ac_ctx.fill();
  ac_ctx.restore();
}

// ══ STROKE ERASER ══
function removeNearStrokes(x,y){
  var THRESH=30/scale;
  var changed=false;
  strokes=strokes.filter(function(s){
    var hit=s.points&&s.points.some(function(p){return Math.hypot(p.x-x,p.y-y)<THRESH;});
    if(hit)changed=true;
    return !hit;
  });
  if(changed){redrawAllStrokes();saveCurrentPage();}
}

function redrawAllStrokes(){
  var ac=document.getElementById('annoCanvas');
  var ac_ctx=ac.getContext('2d');
  // Start from base undo (before current strokes)
  ac_ctx.clearRect(0,0,ac.width,ac.height);
  // Redraw all strokes
  strokes.forEach(function(s){
    ac_ctx.save();
    if(s.tool==='highlight'){ac_ctx.globalAlpha=0.35;ac_ctx.strokeStyle=s.color;ac_ctx.lineWidth=s.size*4;}
    else{ac_ctx.globalAlpha=1;ac_ctx.strokeStyle=s.color;ac_ctx.lineWidth=s.size;}
    ac_ctx.lineCap='round';ac_ctx.lineJoin='round';
    if(s.tool==='arrow'&&s.end){
      drawArrowShape(s.points[0].x,s.points[0].y,s.end.x,s.end.y);
    } else if(s.points&&s.points.length>1){
      ac_ctx.beginPath();ac_ctx.moveTo(s.points[0].x,s.points[0].y);
      for(var i=1;i<s.points.length;i++)ac_ctx.lineTo(s.points[i].x,s.points[i].y);
      ac_ctx.stroke();
    }
    ac_ctx.restore();
  });
}

// ══ TEXT TOOL ══
function placeText(e){
  var pos=getPos(e);
  var area=document.getElementById('edCanvasArea');
  var wrap=document.getElementById('canvasWrap');
  var wRect=wrap.getBoundingClientRect();
  var aRect=area.getBoundingClientRect();
  var overlay=document.getElementById('textOverlay');
  overlay.style.left=(pos.x*scale+(wRect.left-aRect.left))+'px';
  overlay.style.top=(pos.y*scale+(wRect.top-aRect.top))+'px';
  overlay.style.fontSize=Math.max(14,currentSize*4)+'px';
  overlay.style.color=currentColor;
  overlay.style.display='block';overlay.value='';overlay.focus();
  overlay.onkeydown=function(ev){
    if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();commitText(pos.x,pos.y,overlay.value);overlay.style.display='none';}
    if(ev.key==='Escape'){overlay.style.display='none';}
  };
  overlay.onblur=function(){if(overlay.value.trim())commitText(pos.x,pos.y,overlay.value);overlay.style.display='none';};
}
function commitText(x,y,text){
  if(!text.trim())return;
  pushUndo();
  var ac_ctx=document.getElementById('annoCanvas').getContext('2d');
  var fs=Math.max(14,currentSize*4);
  ac_ctx.save();
  ac_ctx.font='600 '+fs+'px '+getComputedStyle(document.body).getPropertyValue('--body');
  ac_ctx.fillStyle=currentColor;
  ac_ctx.strokeStyle='rgba(0,0,0,.5)';ac_ctx.lineWidth=fs*0.06;
  text.split('\n').forEach(function(line,i){
    ac_ctx.strokeText(line,x,y+i*fs*1.3);ac_ctx.fillText(line,x,y+i*fs*1.3);
  });
  ac_ctx.restore();
  saveCurrentPage();
}

// ══ PINCH ZOOM ══
var _pinchDist=0,_pinchScale=1;
var _panning=false,_panSX=0,_panSY=0,_panPX=0,_panPY=0;
document.getElementById('edCanvasArea').addEventListener('touchstart',function(e){
  if(e.touches.length===2){_pinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);_pinchScale=scale;}
},{passive:false});
document.getElementById('edCanvasArea').addEventListener('touchmove',function(e){
  if(e.touches.length===2){
    e.preventDefault();
    var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    scale=Math.max(0.15,Math.min(6,_pinchScale*(d/_pinchDist)));
    applyTransform();
  }
},{passive:false});
document.getElementById('edCanvasArea').addEventListener('wheel',function(e){
  e.preventDefault();
  scale=Math.max(0.15,Math.min(6,scale*(e.deltaY>0?0.9:1.1)));applyTransform();
},{passive:false});

// ══ TOOLBAR ══
function setTool(t){
  currentTool=t;
  ['toolPen','toolHighlight','toolText','toolArrow','toolEraser'].forEach(function(id){
    document.getElementById(id).classList.toggle('active',id==='tool'+t.charAt(0).toUpperCase()+t.slice(1));
  });
  var ep=document.getElementById('eraserPopup');
  ep.classList.toggle('show',t==='eraser');
  document.getElementById('annoCanvas').style.cursor=
    t==='eraser'?'cell':t==='text'?'text':'crosshair';
}
document.getElementById('toolPen').addEventListener('click',function(){setTool('pen');});
document.getElementById('toolHighlight').addEventListener('click',function(){setTool('highlight');});
document.getElementById('toolText').addEventListener('click',function(){setTool('text');});
document.getElementById('toolArrow').addEventListener('click',function(){setTool('arrow');});
document.getElementById('toolEraser').addEventListener('click',function(){setTool('eraser');});

function loadImageFile(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var note=notes.find(function(n){return n.id===activeNoteId;});
      if(!note)return;
      saveCurrentPage();
      // Add as new page
      if(!note.pages)note.pages=[];
      note.pages.push({base:null,anno:null,strokes:[]});
      activePage=note.pages.length-1;
      var cv=getCanvases();
      cv.base.width=img.naturalWidth;cv.base.height=img.naturalHeight;
      cv.anno.width=img.naturalWidth;cv.anno.height=img.naturalHeight;
      cv.baseCtx.drawImage(img,0,0);cv.annoCtx.clearRect(0,0,img.naturalWidth,img.naturalHeight);
      fitToView(img.naturalWidth,img.naturalHeight);
      strokes=[];
      saveCurrentPage();renderPageStrip();pushUndo();
      showToast('Photo added as page '+activePage,'green');
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function loadPdfFile(file){
  if(!file)return;
  if(typeof pdfjsLib==='undefined'){showToast('PDF library not available');return;}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  showToast('Loading PDF pages...','blue');
  var reader=new FileReader();
  reader.onload=function(ev){
    var b64=ev.target.result.split(',')[1];
    var raw=atob(b64),arr=new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
    pdfjsLib.getDocument({data:arr}).promise.then(function(pdf){
      pdfDoc=pdf;pdfTotalPages=pdf.numPages;
      var note=notes.find(function(n){return n.id===activeNoteId;});
      if(!note)return;
      saveCurrentPage();
      // Add all PDF pages
      var startPage=note.pages?note.pages.length:0;
      var pagesAdded=0;
      function addPdfPage(pgNum){
        if(pgNum>pdf.numPages){
          showToast(pdf.numPages+' PDF pages added','green');
          activePage=startPage;renderPageStrip();loadPage(activePage);return;
        }
        pdf.getPage(pgNum).then(function(pg){
          var vp=pg.getViewport({scale:1.6});
          var tmp=document.createElement('canvas');tmp.width=vp.width;tmp.height=vp.height;
          pg.render({canvasContext:tmp.getContext('2d'),viewport:vp}).promise.then(function(){
            if(!note.pages)note.pages=[];
            note.pages.push({base:tmp.toDataURL('image/jpeg',0.85),anno:null,strokes:[]});
            pagesAdded++;
            addPdfPage(pgNum+1);
          });
        });
      }
      addPdfPage(1);
      saveNotes(notes);
    }).catch(function(e){showToast('PDF error: '+e.message.slice(0,50));});
  };
  reader.readAsDataURL(file);
}

// ══ EXPORT ══
document.getElementById('edExport').addEventListener('click',function(){exportCurrentPage();});
function exportCurrentPage(){
  saveCurrentPage();
  var cv=getCanvases();
  var flat=document.createElement('canvas');flat.width=cv.base.width;flat.height=cv.base.height;
  var fc=flat.getContext('2d');fc.drawImage(cv.base,0,0);fc.drawImage(cv.anno,0,0);
  flat.toBlob(function(blob){
    var note=notes.find(function(n){return n.id===activeNoteId;});
    var name=(note?note.name:'FieldNote').replace(/[^a-z0-9]/gi,'-');
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download=name+'-p'+(activePage+1)+'.jpg';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},3000);
    showToast('Saved','green');
  },'image/jpeg',0.92);
}

function emailNote(noteId){
  var note=notes.find(function(n){return n.id===noteId;});
  if(!note||!note.pages||!note.pages[0]||!note.pages[0].base){
    showToast('Note has no content to email');return;
  }
  // Build a flat canvas and open mail with image as body (data: URI approach)
  // Since we can't attach files via mailto, we download + open email
  var cv=document.createElement('canvas');
  var pg=note.pages[0];
  var bImg=new Image();
  bImg.onload=function(){
    cv.width=bImg.naturalWidth;cv.height=bImg.naturalHeight;
    var ctx=cv.getContext('2d');ctx.drawImage(bImg,0,0);
    if(pg.anno){var ai=new Image();ai.onload=function(){ctx.drawImage(ai,0,0);sendEmail(cv,note);};ai.src=pg.anno;}
    else{sendEmail(cv,note);}
  };
  bImg.src=pg.base;
}
function sendEmail(canvas,note){
  var fname=(note.name||'FieldNote').replace(/[^a-z0-9]/gi,'-')+'.jpg';
  var url=canvas.toDataURL('image/jpeg',0.9);
  var a=document.createElement('a');a.href=url;a.download=fname;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){
    var subject='Field Note: '+encodeURIComponent(note.name||'Field Note');
    var body=encodeURIComponent('Field note attached: '+fname+'\n\nC&W Contracting Services');
    var to='wlusk%40cwcontracting.com';
    window.location.href='mailto:'+to+'?subject='+subject+'&body='+body;
    URL.revokeObjectURL(url);
  },500);
  showToast('Opening Mail with note...','green');
}

document.addEventListener('keydown',function(e){
  if(document.getElementById('editorScreen').classList.contains('hidden'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();e.shiftKey?redo():undo();}

});

function formatDate(ts){
  if(!ts)return '';
  var d=new Date(ts);
  var now=new Date();
  if(d.toDateString()===now.toDateString())return 'Today '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
